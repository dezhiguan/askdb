# askdb 对外开放实例的 nginx server 块。
#
# 这段要合并进 **rag-forge 仓库的 nginx.conf**（Server 2 的入口配置由那份
# 统一管理，CI 检测到 nginx.conf 变化才推送）。不要单独在服务器上放文件 ——
# 那样下次 rag-forge 部署会把它覆盖掉。
#
# 证书：2026-08-13 已单独签发并上传，覆盖 askdb.ragforge.net 与
# www.askdb.ragforge.net，有效期至 2026-11-10（DigiCert DV，90 天）。
#
#   宿主机 /data/ssl/ragforge/  →  容器 /etc/nginx/ssl/ragforge/
#   （nginx 跑在 ragforge-nginx 容器里，见 docker-compose-ingress.yml）
#
# ⚠️ 90 天到期，须记得续签。主域名那张 2026-09-05 到期，比这张更早。

# 限流 zone 必须声明在 http 上下文。rag-forge 的 nginx.conf 本身就是被
# include 进 http 块的片段（开头即 upstream），所以放这里是对的；
# 但它是**全局命名**的，合并时注意别与将来别处的同名 zone 冲突。
limit_req_zone $binary_remote_addr zone=askdb_zone:10m rate=5r/s;

# BEGIN ASKDB_UPSTREAM
upstream askdb_backend {
    server 172.25.90.184:31100;      # Server 3 的 k3s NodePort
    keepalive 16;
}
# END ASKDB_UPSTREAM

server {
    listen 80;
    server_name askdb.ragforge.net www.askdb.ragforge.net;
    return 301 https://askdb.ragforge.net$request_uri;
}

server {
    listen 443 ssl;
    server_name askdb.ragforge.net;

    ssl_certificate     /etc/nginx/ssl/ragforge/askdb.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/askdb.ragforge.net.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 限流：askdb 不设账号体系，开放实例只能靠这一层约束调用频率。
    # 直查链路不花钱，但仍会占 CPU 与数据库连接 —— 5 r/s 对人操作绰绰有余，
    # 对脚本刷则明显不够。
    limit_req zone=askdb_zone burst=10 nodelay;
    limit_req_status 429;

    client_max_body_size 64k;        # 只收 SQL 文本，不需要更大

    # 前端换成独立构建的 React 工程后，单次冷加载要下 290KB JS + 53KB CSS。
    # gzip 后是 88KB + 11KB —— 在跨境访问这条链路上，这一项比什么都管用。
    gzip on;
    # **必须有这一条**：gzip_proxied 默认 off，含义是"响应来自上游时不压缩"。
    # askdb 的一切都来自 proxy_pass，只写 gzip on 等于一个字节都没压。
    gzip_proxied  any;
    gzip_comp_level 5;               # 再高收益很小，CPU 却明显上去
    gzip_min_length 1024;
    gzip_vary on;                    # 让中间缓存按 Accept-Encoding 分开存
    # text/html 是默认项，再写一遍会告警重复
    gzip_types text/css text/javascript application/javascript application/json;

    # 构建产物的文件名带内容 hash（index-<hash>.js），改一版就是一个新文件名，
    # 因此可以让浏览器长期缓存而不必担心缓存住旧代码 —— index.html 本身由后端
    # 发 no-store，每次都会重新拿到最新的引用。
    # 不加这段的话，StaticFiles 只发 etag，每次打开都要回源问一趟 304。
    location ^~ /assets/ {
        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 只用 add_header，不配 expires：expires 自己也会发一个 Cache-Control，
        # 两者并存会让响应里出现两条 Cache-Control，取哪条由客户端决定。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # nginx 的 add_header 是**就近整组替换**，不是逐层追加：这个 location 里
        # 只要写了一条 add_header，server 块那四条安全头就全都不再下发。
        # 静态资源至少要把 nosniff 与 HSTS 补回来。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 模型入口不做每 IP 限流（2026-08-25 运营决定：只保留应用层每日配额）
    location = /api/ask {
        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;      # 模型调用比直查慢，放宽到 60s
    }

    location / {
        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;      # 直查有 R-12 3s 超时兜底，30s 足够
    }

}
