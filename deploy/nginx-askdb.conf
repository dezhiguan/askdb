# askdb 对外开放实例的 nginx server 块。
#
# 这段要合并进 **rag-forge 仓库的 nginx.conf**（Server 2 的入口配置由那份
# 统一管理，CI 检测到 nginx.conf 变化才推送）。不要单独在服务器上放文件 ——
# 那样下次 rag-forge 部署会把它覆盖掉。
#
# ⚠️ 本文件与 rag-forge/nginx.conf 里那一段必须**逐字一致**。
#    2026-09-09 核对时发现两边已经漂了很久：gzip 与 /assets/ 长缓存这两段
#    在本文件里写了很久，却从未合并过去，线上因此一直在发未压缩的 290KB JS。
#    改这里的同时必须同步改那边，只改一边等于没改。
#
# 证书：2026-08-13 已单独签发并上传，覆盖 askdb.ragforge.net 与
# www.askdb.ragforge.net，有效期至 2026-11-10（DigiCert DV，90 天）。
#
#   宿主机 /data/ssl/ragforge/  →  容器 /etc/nginx/ssl/ragforge/
#   （nginx 跑在 ragforge-nginx 容器里，见 docker-compose-ingress.yml）
#
# ⚠️ 90 天到期，须记得续签。

# 限流 zone 必须声明在 http 上下文。rag-forge 的 nginx.conf 本身就是被
# include 进 http 块的片段（开头即 upstream），所以放这里是对的；
# 但它是**全局命名**的，合并时注意别与将来别处的同名 zone 冲突。
#
# zone 大小按"能装下一天的独立 IP"算：$binary_remote_addr 每个状态约 64 字节，
# 16m ≈ 26 万个 IP，10 万 PV 对应的独立 IP 远低于此。给小了的后果不是报错，
# 是 nginx 开始淘汰最老的状态并打 warn，限流随之出现空洞。
limit_req_zone  $binary_remote_addr zone=askdb_web:16m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=askdb_sql:10m rate=2r/s;
limit_req_zone  $binary_remote_addr zone=askdb_ask:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=askdb_conn:10m;

# 静态资源在入口层缓存。构建产物文件名带内容 hash，改一版就是新文件名，
# 因此可以放心长期缓存 —— 这一项直接决定后端 Pod 要不要为每个新访客重发
# 一遍 290KB 的 JS。10 万 PV 里冷启占比不低，不缓存的话这部分全压在两个
# Python 进程的事件循环上，而它们本该去跑查询。
#
# ⚠️ 这条是 http 级指令，写错会让**整个 ingress**（含 ragforge / careerforge）
#    起不来。改完必须先 nginx -t 再 reload，别直接 restart。
proxy_cache_path /var/cache/nginx/askdb levels=1:2 keys_zone=askdb_assets:10m
                 max_size=512m inactive=7d use_temp_path=off;

# BEGIN ASKDB_UPSTREAM
upstream askdb_backend {
    server 172.25.90.184:31100 max_fails=3 fail_timeout=10s;
    # keepalive 16 是按"没什么人用"配的。42 r/s 下每秒要新建的连接数远超它，
    # 表现是大量 TIME_WAIT 与握手延迟叠在每个请求上。64 条常连足够覆盖峰值。
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}
# END ASKDB_UPSTREAM

server {
    listen 80;
    server_name askdb.ragforge.net www.askdb.ragforge.net;
    return 301 https://askdb.ragforge.net$request_uri;
}

server {
    listen 443 ssl;
    server_name askdb.ragforge.net;

    ssl_certificate     /etc/nginx/ssl/ragforge/askdb.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/askdb.ragforge.net.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 默认档：浏览页面与只读接口。30 r/s + burst 60 意味着单个 IP 可以连着
    # 打开五六个页面而不被挡，同时把"每秒上百次"的脚本挡在外面。
    limit_req zone=askdb_web burst=60 nodelay;
    limit_req_status 429;
    # 把 429 打进 error_log。没有这一条，限流是否在误伤真实用户只能靠猜。
    limit_req_log_level warn;

    # 并发连接数上限，防的是慢连接把 worker 占满（限速率治不了这个）。
    # 200 是按 NAT 出口给的：浏览器对单域名开 6 条连接，200 条约等于
    # 30 个共用出口的人同时在线，仍能挡住单机的连接洪水。
    limit_conn askdb_conn 200;
    limit_conn_status 429;

    client_max_body_size 64k;        # 只收 SQL 文本，不需要更大

    # 前端是独立构建的 React 工程，单次冷加载 290KB JS + 53KB CSS。
    # gzip 后是 88KB + 11KB —— 跨境访问这条链路上，这一项比什么都管用。
    #
    # ⚠️ 这段在 askdb 仓库的 deploy/nginx-askdb.conf 里写了很久，但**从未合并
    #    到本文件**，也就是说线上一直在发未压缩的 290KB。2026-09-09 补上。
    gzip on;
    # **必须有这一条**：gzip_proxied 默认 off，含义是"响应来自上游时不压缩"。
    # askdb 的一切都来自 proxy_pass，只写 gzip on 等于一个字节都没压。
    gzip_proxied  any;
    gzip_comp_level 5;               # 再高收益很小，CPU 却明显上去
    gzip_min_length 1024;
    gzip_vary on;                    # 让中间缓存按 Accept-Encoding 分开存
    # text/html 是默认项，再写一遍会告警重复
    gzip_types text/css text/javascript application/javascript application/json;

    location ^~ /assets/ {
        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 让上游只回未压缩的那一份，压缩统一在这里做。
        # 不清掉这个头的话，上游哪天加了 gzip 中间件，缓存键（默认不含
        # Accept-Encoding）就会把 gzip 与非 gzip 两种响应体存成同一条 ——
        # 先到的那份发给所有人，不支持压缩的客户端拿到一坨二进制。
        # 现在上游没有压缩中间件，所以这一行是把将来那个坑提前填掉。
        proxy_set_header Accept-Encoding   "";

        proxy_cache askdb_assets;
        proxy_cache_valid 200 7d;
        # 同一个新文件同时被很多人请求时只回源一次，其余等这一次的结果。
        # 发版瞬间正是这种形状：所有人同时来拿同一个新 hash 的 JS。
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # 后端抖动时继续发旧副本，而不是把 502 给到用户。
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        # 静态资源本身就该被高频取，不占动态那档的额度。
        limit_req zone=askdb_web burst=120 nodelay;

        # 只用 add_header，不配 expires：expires 自己也会发一个 Cache-Control，
        # 两者并存会让响应里出现两条 Cache-Control，取哪条由客户端决定。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # nginx 的 add_header 是**就近整组替换**，不是逐层追加：这个 location 里
        # 只要写了一条 add_header，server 块那四条安全头就全都不再下发。
        # 静态资源至少要把 nosniff 与 HSTS 补回来。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 模型入口。**这是唯一花钱的路径**，因此单独一档，且按分钟计。
    #
    # 2026-08-25 曾整档撤掉每 IP 限流，只留应用层 daily_quota 兜底。那个决定
    # 在 500 次/天的额度下代价有限；额度提到 2 万次/天之后，"单人几分钟刷光
    # 全天额度"就从"损失几块钱"变成"损失几十块并且让所有人当天用不了"。
    # 所以这一档加回来 —— 它挡的不是花钱本身，是**一个人把全站额度花光**。
    #
    # 20 r/m + burst 10 nodelay 的实际手感：先给 10 次立即放行，之后每 3 秒
    # 恢复一次。人正常提问远低于此；脚本连续刷会在第 11 次上撞到 429。
    #
    # ⚠️ 注意一处长期与注释不符的行为：nginx 的 limit_req **只在本层没有任何
    #    limit_req 时才继承上层**。原来 = /api/ask 里一条都没写，所以它其实
    #    一直在吃 server 块那条 5 r/s，而注释写的是"不做每 IP 限流"。
    #    现在两条都显式写出来，行为与注释一致。
    location = /api/ask {
        limit_req zone=askdb_ask burst=10 nodelay;
        limit_req zone=askdb_web burst=60 nodelay;

        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        # 写死域名，不用请求头里带过来的那个变量 —— 它由攻击者可控。
        # semgrep 的 generic.nginx.security.request-host-used 会拦下那种写法，
        # 且该规则是纯文本匹配、连注释里的变量名也算，所以这里不写出它。
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;      # 模型调用比直查慢，放宽到 60s
    }

    # 直查 SQL。不花钱，但每一次都是**一条真打到生产库的语句**，外加
    # sqlglot 的 AST 解析（R-20 那条 4 秒 CPU 的实测就来自这里）。
    # 原来它落在 location / 的通用档里，跟拉一张图片同价 —— 这不对。
    # 2 r/s + burst 20：人改一句 SQL 再点一次远低于此，脚本连刷会被压住。
    location = /api/sql {
        limit_req zone=askdb_sql burst=20 nodelay;
        limit_req zone=askdb_web burst=60 nodelay;

        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;      # 直查有 R-12 3s 超时兜底，30s 足够
    }

    location / {
        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;      # 直查有 R-12 3s 超时兜底，30s 足够
    }

    # 自检与内省已放开（2026-08-25 运营决定）。
}
