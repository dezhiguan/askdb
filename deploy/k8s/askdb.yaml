# askdb 对外开放实例 —— 与 CareerMate 同机（Server 3 的 k3s）。
#
# 之所以也走 k3s 而不是 systemd：Server 3 上已有的一套编排就是 k3s，
# 重启、健康检查、滚动更新都由它统一管；再引入一套进程管理方式，
# 出事时排查路径就多了一条。
apiVersion: v1
kind: Namespace
metadata:
  name: askdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: askdb
  namespace: askdb
spec:
  # 多副本的三处前提都已落地，缺一不可：
  #   1. 每日配额走 Redis 共享计数（askdb/quota.py）—— 否则每个副本各数各的，
  #      上限直接变成 N 倍。
  #   2. 检查点库开 WAL + busy_timeout（graph.build_graph）—— 否则两个 Pod
  #      同时写会把 database is locked 打到正常查询上。
  #   3. 审计日志改成 O_APPEND 单次 write（trace.write_audit）—— 否则两个进程
  #      的片段交错落盘，整行 JSON 作废。
  #
  # 这三条都依赖**同一台机器的同一个 hostPath**：单节点 k3s 才成立。
  # 真要跨节点，检查点得换 PG 后端、审计得换集中式收集，别只把这里调大。
  # 2026-09-09 由 2 提到 4，按日访问量 10 万级（@guandezhi）。
  #
  # 容量口径：100,000 PV/天、峰值小时约 42 r/s。入口 nginx 接管了 /assets/
  # 的缓存之后，压到 Pod 上的主要是接口请求，峰值约 29 r/s。
  # 每个 Pod 是**单个 uvicorn worker**（cli.serve 没传 workers），一个 Python
  # 进程吃不满一个核，所以扩容只能靠加副本，把 CPU limit 提到 1 核以上没有意义。
  # 4 副本下每个约 7 r/s，留足了余量。
  #
  # ⚠️ 应用前先确认节点装得下：`kubectl describe node <node> | grep -A6 Allocated`。
  #    上一版注释记录节点内存已用 75%。这里把 requests 压得很低（4×256Mi=1Gi）
  #    正是为了好调度，limits 才是真正的上限。
  replicas: 4
  strategy:
    type: RollingUpdate
    # maxSurge 保持 0：节点内存紧，滚动期间不额外撑起第五个 Pod。
    # 4 副本下 maxUnavailable: 1 意味着滚动期间始终有 3 个在服务。
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels: { app: askdb }
  template:
    metadata:
      labels: { app: askdb }
    spec:
      imagePullSecrets:
        - name: acr-cred
      # /api/ask 的上游超时是 60s（入口 nginx）。默认 30s 的优雅停机会在
      # 滚动更新时把还在等模型返回的请求直接掐断，用户看到的是一次莫名其妙的
      # 502。给到 75s，比那条 60s 长。
      terminationGracePeriodSeconds: 75
      volumes:
        # 用 hostPath 而不是 PVC：本集群的 local-path 供应器要起一个 helper pod
        # 去宿主机建目录，而 Server 3 没有公网出口，helper 镜像拉不下来 ——
        # PVC 会一直卡在 Pending（实测 create process timeout after 120 seconds）。
        # 单节点场景本来也不需要动态供应，宿主机目录就够。
        # 2026-09-09 起审计/审批/复核/检查点/成绩/配额都在 PostgreSQL 里
        # （observability.store: postgres），这个卷**只剩两个用途**：连接串缺失
        # 时的退路，以及迁移时从旧 JSONL 里读历史。确认库里数据完整、观察一段
        # 时间之后即可拆掉它 —— 拆之前先把 migrate-store 跑干净。
        - name: var
          hostPath:
            path: /opt/askdb/var
            type: DirectoryOrCreate
      # hostPath 由 kubelet 以 root 创建（0755），而容器以 uid 10001 运行，
      # 不改属主就写不进审计日志与检查点库 —— 失败复现、回放归因全落空。
      # 放在 initContainer 里做，换台机器重建也能自愈，不依赖手工准备。
      initContainers:
        - name: fix-perm
          # 复用同一个镜像，不引入 busybox —— Server 3 没有公网出口，
          # 拉不了任何外部镜像（PVC 就是栽在这上面）。
          image: PLACEHOLDER_IMAGE
          command: ["sh", "-c", "chown -R 10001:10001 /app/var && chmod 700 /app/var"]
          volumeMounts:
            - name: var
              mountPath: /app/var
          securityContext:
            runAsUser: 0
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
      containers:
        - name: askdb
          image: PLACEHOLDER_IMAGE      # 由 CI 按 commit 替换
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: var
              mountPath: /app/var
          # 模型密钥来自 k8s Secret，**不进镜像、不进仓库**。
          # 该 Secret 由运维一次性创建（见 deploy/README.md），
          # 不随 CI 重建 —— 密钥不必经过 GitHub。
          envFrom:
            - secretRef:
                name: askdb-llm
                optional: false
            # 数据库口令（ASKDB_PROD_PG_PASSWORD）。
            #
            # 2026-09-03 起对外实例直连 ragforge 生产主库，不再跑样例库。
            # optional: false 是有意与上面几个相反：缺了它 Pod 会卡在
            # CreateContainerConfigError、rollout 超时 —— 那正是想要的。
            # 设成 optional 的话，Secret 漏建时服务照常起、库连不上，
            # 站点变成一个每次查询都报错的空壳，而错误指向数据源不可用，
            # 排查方向完全跑偏。连不上库的实例本来就不该起来。
            - secretRef:
                name: askdb-db
                optional: false
            # 登录与一键体验的会话签名密钥（ASKDB_SESSION_SECRET）。
            # optional: true 是权衡后的选择：设成必需的话，忘了建这个 Secret
            # 会让 Pod 卡在 CreateContainerConfigError、rollout 超时，整站停更；
            # 而登录只是这套部署的一项能力，不该有这么大的爆炸半径。
            # 代价是缺失时**静默降级** —— 服务照常起、页面照常开，只是
            # auth.enabled() 恒为 false，前端连登录入口都不显示。
            # 因此冒烟里钉了一条 /api/auth/me 的 enabled 断言来兜（见 ci-cd.yml）。
            #
            # 多副本必须共用同一把：票是无状态签名，两个副本各拿各的密钥，
            # 表现是"刷新几次就掉线"—— 负载轮到另一个副本时验签失败。
            - secretRef:
                name: askdb-auth
                optional: true
            # 数据源注册表的元数据库（ASKDB_SOURCES_DSN，可带 ASKDB_SOURCES_PASSWORD）。
            #
            # 2026-09-06 起数据源存 PG 而不是 var/sources/*.yaml —— 两副本
            # 原来各写各的 hostPath 且无锁，探活会整文件重写、可能把白名单带脏。
            #
            # optional: true 而不是 false，与 askdb-db 相反：数据源存储连不上
            # **不该让服务起不来**，那正是这轮改造要去掉的耦合。代价是缺失时
            # 数据源相关接口返回 503（sources_store_unavailable），其余功能正常。
            #
            # ⚠️ 上线前必须先建这个 Secret，否则对外实例的数据源管理页整页 503。
            #    冒烟里还没有钉它的断言 —— 建完 Secret 之后补一条。
            - secretRef:
                name: askdb-sources
                optional: true
            # 配额计数用的共享 Redis（复用数据机上那套，带口令）。
            # optional: true 是有意的 —— 没建这个 Secret 时退回本地文件计数，
            # 单副本下依然正确，不至于因为少建一个 Secret 就起不来。
            # 多副本部署前务必确认它存在，且 /api/health 的
            # quota.multi_replica_safe 为 true。
            - secretRef:
                name: askdb-redis
                optional: true
            # 调用链观测（可选，二选一；都没建则审计页如实显示"未接入"，
            # 主链路零影响）。国内机房推荐自托管 Langfuse —— 228 出网到
            # LangSmith 云不通（实测超时），LangSmith 仅留给能出海的部署。
            - secretRef:
                name: askdb-langfuse
                optional: true
            - secretRef:
                name: askdb-langsmith
                optional: true
          lifecycle:
            preStop:
              # 先等一会儿再让进程收 SIGTERM：Pod 进入 Terminating 之后，
              # kube-proxy 摘掉它的 endpoint 与容器收到信号是**两件并发的事**，
              # 不等这几秒，摘干净之前进来的请求会打在一个正在关的进程上。
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            # 2026-09-09 上调，配合 4 副本。
            #
            # requests 是给调度器看的，压低以便在内存吃紧的节点上排得下；
            # limits 才是真正的天花板：
            #   · CPU 500m→1000m：单进程最多用满一个核，给到 1 核即到顶。
            #     原来的 500m 意味着并发一上来就被 cgroup 限流，表现为
            #     "没报错但每个请求都变慢"，最难查的那一类。
            #   · 内存 512Mi→768Mi：langchain + duckdb 的常驻本身
            #     就吃掉一大半，再叠上并发请求各自持有的结果行就很接近上限。
            #     ⚠️ 这不能解决审计页那条（见文件末尾的说明），只是给日常留余量。
            requests: { cpu: "200m",  memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            # 与 Dockerfile 的 USER 10001 对齐。显式写出来，
            # 免得镜像里改了用户而这里不知道
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # 样例库与依赖都在镜像里，运行期只有 /app/data 需要写（审计日志）
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: askdb
  namespace: askdb
spec:
  type: NodePort
  selector: { app: askdb }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 31100          # careermate 31080 / ragforge 31090，这里取 31100
  # externalTrafficPolicy 保持默认的 Cluster（会 SNAT，源地址丢失）。
  # 不改成 Local 是因为应用侧已经不依赖 TCP 源地址了：入口 nginx 用
  # proxy_set_header X-Real-IP 把真实来源带进来，限流分桶读的是那个头
  # （askdb/server.py 的 _client_ip）。改成 Local 反而会让只跑在部分节点上的
  # Pod 从别的节点进不来。

---
# ===========================================================================
# 2026-09-09 日访问量 10 万级：这份清单管不到的那一条
#
# 扩副本、提 limit、调限流都做完之后，**剩下的瓶颈不在 k8s 这一层**：
#
# observability.store 目前是文件（config/public.yaml 的 audit_log 指向
# hostPath 上的 JSONL）。askdb/audit.py 的 read_records 是把**整个文件**
# 读进内存再逐行解析的，而审计页、任务中心、质量看板、统计接口全都走它。
#
# 10 万 PV/天大约产生 1.5 万条审计记录、约 15MB/天。跑一个月就是 450MB 的
# 文件，任何人点开审计页，某个 Pod 就要把它整个读成 Python 对象 —— 实际
# 占用是文件体积的好几倍，768Mi 的 limit 拦不住，表现为 Pod 被 OOMKill、
# liveness 探活失败、滚动重启，而入口只看到 502。
#
# 也就是说：**在审计存储迁到 PostgreSQL 之前，这个站点不具备承载 10 万
# 日访问量的条件**，跟限流配多少无关。那件事另有人在做（迁 store: postgres，
# 目前还在工作区、未进 main），落地之后本文件里的 hostPath 卷也就只剩
# 迁移用途了。上量之前先确认它已经合并并生效：
#
#   curl -s https://askdb.ragforge.net/api/health | jq '.observability'
# ===========================================================================
