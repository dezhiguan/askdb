# askdb 对外开放实例 —— 与 CareerMate 同机（Server 3 的 k3s）。
#
# 之所以也走 k3s 而不是 systemd：Server 3 上已有的一套编排就是 k3s，
# 重启、健康检查、滚动更新都由它统一管；再引入一套进程管理方式，
# 出事时排查路径就多了一条。
apiVersion: v1
kind: Namespace
metadata:
  name: askdb
---
# 审计日志的持久卷。
# 每日配额靠"数当天审计日志里的条数"实现 —— 日志不持久化的话，
# Pod 一重启计数归零，配额就形同虚设：脚本只要能让 Pod 重启（或等一次
# 滚动更新），额度立刻回满。k3s 自带 local-path 供应器，1Gi 足够。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: askdb-var
  namespace: askdb
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: askdb
  namespace: askdb
spec:
  # 必须是 1：每日配额靠单副本的本地审计日志计数，多副本会各算各的，
  # 实际额度变成 N 倍。真要扩容得先把计数改成共享存储。
  replicas: 1
  strategy:
    type: RollingUpdate
    # PVC 是 ReadWriteOnce，新旧 Pod 不能同时挂 —— maxSurge 必须为 0，
    # 否则新 Pod 会卡在 ContainerCreating 等卷释放
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels: { app: askdb }
  template:
    metadata:
      labels: { app: askdb }
    spec:
      imagePullSecrets:
        - name: acr-cred
      volumes:
        - name: var
          persistentVolumeClaim:
            claimName: askdb-var
      containers:
        - name: askdb
          image: PLACEHOLDER_IMAGE      # 由 CI 按 commit 替换
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: var
              mountPath: /app/var
          # 模型密钥来自 k8s Secret，**不进镜像、不进仓库**。
          # 该 Secret 由运维一次性创建（见 deploy/README.md），
          # 不随 CI 重建 —— 密钥不必经过 GitHub。
          envFrom:
            - secretRef:
                name: askdb-llm
                optional: false
          resources:
            requests: { cpu: "50m",  memory: "192Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            # 与 Dockerfile 的 USER 10001 对齐。显式写出来，
            # 免得镜像里改了用户而这里不知道
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # 样例库与依赖都在镜像里，运行期只有 /app/data 需要写（审计日志）
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: askdb
  namespace: askdb
spec:
  type: NodePort
  selector: { app: askdb }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 31100          # careermate 31080 / ragforge 31090，这里取 31100
