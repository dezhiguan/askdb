# askdb 对外开放实例 —— 与 CareerMate 同机（Server 3 的 k3s）。
#
# 之所以也走 k3s 而不是 systemd：Server 3 上已有的一套编排就是 k3s，
# 重启、健康检查、滚动更新都由它统一管；再引入一套进程管理方式，
# 出事时排查路径就多了一条。
apiVersion: v1
kind: Namespace
metadata:
  name: askdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: askdb
  namespace: askdb
spec:
  replicas: 1                      # 无共享状态，但样例库是只读的，多副本无收益
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: askdb }
  template:
    metadata:
      labels: { app: askdb }
    spec:
      imagePullSecrets:
        - name: acr-cred
      containers:
        - name: askdb
          image: PLACEHOLDER_IMAGE      # 由 CI 按 commit 替换
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: "50m",  memory: "192Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            # 与 Dockerfile 的 USER 10001 对齐。显式写出来，
            # 免得镜像里改了用户而这里不知道
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # 样例库与依赖都在镜像里，运行期只有 /app/data 需要写（审计日志）
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: askdb
  namespace: askdb
spec:
  type: NodePort
  selector: { app: askdb }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 31100          # careermate 31080 / ragforge 31090，这里取 31100
