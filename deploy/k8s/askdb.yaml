# askdb 对外开放实例 —— 与 CareerMate 同机（Server 3 的 k3s）。
#
# 之所以也走 k3s 而不是 systemd：Server 3 上已有的一套编排就是 k3s，
# 重启、健康检查、滚动更新都由它统一管；再引入一套进程管理方式，
# 出事时排查路径就多了一条。
apiVersion: v1
kind: Namespace
metadata:
  name: askdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: askdb
  namespace: askdb
spec:
  # 每日配额已改为 Redis 共享计数（见 askdb/quota.py），不再是扩容的拦路虎。
  # 但仍保持 1 —— 还剩两处单副本假设：
  #   1. 检查点是 SQLite 单文件。多个 Pod 同时写同一个库会争锁，
  #      "database is locked" 会打在正常查询上。要多副本得先换成 PG 后端。
  #   2. 审计日志是同一个 JSONL 文件的追加写，多进程交错写有撕行风险。
  # 这两条都不是配额问题，别因为配额通了就顺手把这里调大。
  replicas: 1
  strategy:
    type: RollingUpdate
    # maxSurge 必须为 0：新旧 Pod 会挂同一个 hostPath，同时在跑就等于
    # 两个进程写同一个 SQLite 检查点库与同一个审计文件
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels: { app: askdb }
  template:
    metadata:
      labels: { app: askdb }
    spec:
      imagePullSecrets:
        - name: acr-cred
      volumes:
        # 用 hostPath 而不是 PVC：本集群的 local-path 供应器要起一个 helper pod
        # 去宿主机建目录，而 Server 3 没有公网出口，helper 镜像拉不下来 ——
        # PVC 会一直卡在 Pending（实测 create process timeout after 120 seconds）。
        # 单节点场景本来也不需要动态供应，宿主机目录就够。
        - name: var
          hostPath:
            path: /opt/askdb/var
            type: DirectoryOrCreate
      # hostPath 由 kubelet 以 root 创建（0755），而容器以 uid 10001 运行，
      # 不改属主就写不进审计日志与检查点库 —— 失败复现、回放归因全落空。
      # 放在 initContainer 里做，换台机器重建也能自愈，不依赖手工准备。
      initContainers:
        - name: fix-perm
          # 复用同一个镜像，不引入 busybox —— Server 3 没有公网出口，
          # 拉不了任何外部镜像（PVC 就是栽在这上面）。
          image: PLACEHOLDER_IMAGE
          command: ["sh", "-c", "chown -R 10001:10001 /app/var && chmod 700 /app/var"]
          volumeMounts:
            - name: var
              mountPath: /app/var
          securityContext:
            runAsUser: 0
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
      containers:
        - name: askdb
          image: PLACEHOLDER_IMAGE      # 由 CI 按 commit 替换
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: var
              mountPath: /app/var
          # 模型密钥来自 k8s Secret，**不进镜像、不进仓库**。
          # 该 Secret 由运维一次性创建（见 deploy/README.md），
          # 不随 CI 重建 —— 密钥不必经过 GitHub。
          envFrom:
            - secretRef:
                name: askdb-llm
                optional: false
            # 配额计数用的共享 Redis（复用数据机上那套，带口令）。
            # optional: true 是有意的 —— 没建这个 Secret 时退回本地文件计数，
            # 单副本下依然正确，不至于因为少建一个 Secret 就起不来。
            # 多副本部署前务必确认它存在，且 /api/health 的
            # quota.multi_replica_safe 为 true。
            - secretRef:
                name: askdb-redis
                optional: true
          resources:
            requests: { cpu: "50m",  memory: "192Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            # 与 Dockerfile 的 USER 10001 对齐。显式写出来，
            # 免得镜像里改了用户而这里不知道
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # 样例库与依赖都在镜像里，运行期只有 /app/data 需要写（审计日志）
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: askdb
  namespace: askdb
spec:
  type: NodePort
  selector: { app: askdb }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 31100          # careermate 31080 / ragforge 31090，这里取 31100
