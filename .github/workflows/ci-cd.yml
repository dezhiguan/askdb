name: askdb CI/CD

# 与 CareerMate 同机部署（Server 3 的 k3s），经跳板机上机，
# 复用它那套 SSH 脚手架 —— 不新增登机凭据。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: askdb-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 数据源注册表自 2026-09-06 起只有 PG 一种存储，用例不 skip 只会 fail ——
    # 没有这个服务，tests/test_sources.py 整批红，而它测的是"服务端会不会
    # 按用户填的地址向外建连"这类东西，正是最不能不跑的一批。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: askdb
          POSTGRES_PASSWORD: askdb
          POSTGRES_DB: askdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U askdb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # 不用 --system：runner 上的 /usr 是 Debian externally-managed，uv 会直接拒绝。
      # 也不要自己 uv venv —— setup-uv 已经建好 .venv 并设了 VIRTUAL_ENV，
      # 再建一次会报 "already exists"。直接装进去，再把它加进 PATH。
      - name: Install
        run: |
          # dev extra 里已包含 fastapi/uvicorn/httpx/pytest —— 之前只装
          # postgres，fastapi 落在 web extra 里没被装上，测试直接 collect 失败
          uv pip install -e ".[postgres,dev]"
          echo "${VIRTUAL_ENV}/bin" >> "${GITHUB_PATH}"

      - name: Seed sample database
        run: python -m data.seed

      # Node 用于前端脚本冒烟测试 —— 那层专抓浏览器端才暴露的
      # ReferenceError / TypeError，Python 测试碰不到。没有 Node 会自动跳过，
      # 所以这里必须装上，否则会静默少跑一批用例。
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Run tests
        # 用 python -m 与本地跑法保持一致（本地一直是 python -m pytest）。
        # pyproject 里也配了 pythonpath，两层都兜住。
        env:
          # 与 ASKDB_SOURCES_DSN 有意不同名：跑一次测试会建/删 schema，
          # 复用运行时那个变量意味着谁在本机跑一次测试就动了自己的真数据源。
          ASKDB_TEST_SOURCES_DSN: >-
            host=127.0.0.1 port=5432 dbname=askdb_test user=askdb password=askdb
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 版本按 vite 的 engines 取（^20.19.0 || >=22.12.0）。写 22 而不是 20：
      # 20 已进维护期，setup-node 解析出的补丁号会随时间漂，而下面那条
      # 漂移守卫拿构建产物逐字节比对，工具链越稳越好。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 必须是 ci 不是 install：install 会按 semver 把依赖升上去，产出的
      # bundle 与本地不一致，守卫就会红在与本次改动无关的版本差异上。
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # build 里含 tsc -b —— 类型错误应该红在这里，而不是等到线上白屏。
      - name: Build
        working-directory: frontend
        run: npm run build

      # 构建产物入 git，镜像里没有 node（见 Dockerfile / frontend/README）。
      # 于是"改了 src 却忘了 npm run build"这件事全链路无声：单测绿、镜像绿、
      # rollout 绿、/api/health 绿，只有界面停在上一版。这一关是唯一能挡住它的。
      #
      # 前提是构建可复现。已验证：同一份 lock 在干净目录 npm ci 后重建，
      # 文件名 hash 与内容逐字节一致（macOS 上验的）。vite 8 的打包器是原生的
      # rolldown + lightningcss，**跨平台一致性没有在 linux 上实测过** ——
      # 如果这一关红在与本次改动无关的地方（本地明明刚 build 过），先怀疑
      # 跨平台产物差异，把比对退化成"index.html 引用的文件名一致"再看。
      - name: Build output must match what is committed
        run: |
          if ! git diff --exit-code -- askdb/web; then
            echo "::error::askdb/web 与 frontend/src 不一致 —— 本地执行 cd frontend && npm run build，并把产物一起提交"
            exit 1
          fi
          # 新产生的文件是未跟踪状态，git diff 看不见，得单独查一次
          UNTRACKED="$(git ls-files --others --exclude-standard -- askdb/web)"
          if [[ -n "${UNTRACKED}" ]]; then
            echo "::error::构建产生了未提交的新产物：${UNTRACKED}"
            exit 1
          fi

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 前端也是准入条件：产物过期等于界面没上线，而它不会让任何别的关变红
    needs: [test, frontend]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    # 不设 job outputs：GitHub **不会把含 secret 的 output 传给下游 job**
    # （直接变空，不是打码成 ***）。镜像名由 ACR_REGISTRY 拼出，必然含 secret，
    # 所以 deploy 那边自己从同一个 secret + 同一个 GITHUB_SHA 重算，
    # 两边算法一致即可，无需跨 job 传值。
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          if [[ -z "${ACR_REGISTRY}" ]]; then
            echo "ACR_REGISTRY must be set"; exit 1
          fi
          # 阿里云 ACR 有两个端点，用途相反，不能混：
          #   -vpc.  内网，只在阿里云 VPC 内可达 —— **k8s 拉取**走这个（快且不计流量费）
          #   无 -vpc 公网 —— **CI 推送**只能走这个，GitHub runner 在公网
          # secret 里存的是 VPC 地址（与 careermate 一致），推送时换掉 -vpc.
          PULL_REGISTRY="${ACR_REGISTRY%/}"
          PUSH_REGISTRY="${ACR_PUBLIC_REGISTRY:-${PULL_REGISTRY/-vpc./.}}"
          TAG="${GITHUB_SHA::12}"
          # tag 用 commit sha 而不是 latest：出问题时能确切知道线上跑的是
          # 哪次提交，回滚也只是把 tag 改回去
          echo "server=${PUSH_REGISTRY%%/*}" >> "${GITHUB_OUTPUT}"
          echo "push_image=${PUSH_REGISTRY}/askdb:${TAG}" >> "${GITHUB_OUTPUT}"
          echo "pull_image=${PULL_REGISTRY}/askdb:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        env:
          ACR_SERVER: ${{ steps.image.outputs.server }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE: ${{ steps.image.outputs.push_image }}
        run: |
          printf '%s' "${ACR_PASSWORD}" | docker login "${ACR_SERVER}" -u "${ACR_USERNAME}" --password-stdin
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

  deploy:
    name: deploy-k3s-server3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-push]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH (Server 3, via jump host)
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: |
          if [[ -z "${SSH_KEY}" || -z "${DEPLOY_HOST}" ]]; then
            echo "CAREERMATE_APP_SSH_KEY and CAREERMATE_APP_HOST must be set"; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          ssh-keyscan "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host askdb-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' '  User root'
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' 'Host askdb-app'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' '  User root'
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ProxyJump askdb-jump'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Apply manifest on Server 3
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30)
          # k8s 从 **VPC 端点**拉取（内网、不计流量费）；CI 推的是公网端点。
          # 与 build-and-push 用同一个 secret 和同一个 GITHUB_SHA，算法一致。
          IMAGE="${ACR_REGISTRY%/}/askdb:${GITHUB_SHA::12}"
          if [[ -z "${ACR_REGISTRY}" ]]; then echo "ACR_REGISTRY must be set"; exit 1; fi
          echo "将部署镜像 tag: ${GITHUB_SHA::12}"
          # 占位符在 CI 侧替换，服务器上不做字符串拼接 —— 少一处出错的地方
          sed "s|PLACEHOLDER_IMAGE|${IMAGE}|" deploy/k8s/askdb.yaml > /tmp/askdb.rendered.yaml
          grep -q "PLACEHOLDER_IMAGE" /tmp/askdb.rendered.yaml && { echo "镜像占位符未被替换"; exit 1; }
          grep -q "image: .\+askdb:" /tmp/askdb.rendered.yaml || { echo "渲染后的 manifest 没有镜像名"; exit 1; }
          scp -F ~/.ssh/config /tmp/askdb.rendered.yaml askdb-app:/tmp/askdb.yaml
          ACR_PASSWORD_B64="$(printf '%s' "${ACR_PASSWORD}" | base64 -w0)"
          timeout 15m ssh "${SSH_OPTS[@]}" askdb-app \
            "ACR_REGISTRY='${ACR_REGISTRY}' ACR_USERNAME='${ACR_USERNAME}' ACR_PASSWORD_B64='${ACR_PASSWORD_B64}' bash -s" <<'EOF'
          set -euo pipefail
          ACR_PASSWORD="$(printf '%s' "${ACR_PASSWORD_B64}" | base64 -d)"
          kubectl create namespace askdb --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n askdb create secret docker-registry acr-cred \
            --docker-server="${ACR_REGISTRY%%/*}" \
            --docker-username="${ACR_USERNAME}" \
            --docker-password="${ACR_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f /tmp/askdb.yaml
          kubectl -n askdb rollout status deployment/askdb --timeout=180s
          rm -f /tmp/askdb.yaml
          EOF

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Health
        run: |
          BASE="${{ vars.ASKDB_BASE_URL || 'https://askdb.ragforge.net' }}"
          BODY="$(curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 "${BASE}/api/health")"
          python3 - <<'PY' "${BODY}"
          import json, sys
          d = json.loads(sys.argv[1])
          assert d["datasource"]["ok"], d
          # 2026-09-03 起对外实例直连 ragforge 生产主库，"只能连样例库"这条
          # 安全边界没了 —— 断言不是删掉，是换到接替它的那几条上。
          #
          # 库里是真数据，所以下面三条一条都不能松：
          assert d["datasource"]["type"] == "postgresql", f"数据源被改回样例库或改错了：{d['datasource']}"
          assert d["tenant"]["enabled"], f"租户隔离被关了：{d['tenant']}"
          assert d["tenant"]["mode"] == "rls_and_predicate", \
              f"对外实例要双层隔离，应用层被绕过时库侧 RLS 仍在：{d['tenant']}"
          # 口令必须走环境变量 —— 连接串里出现明文就是把口令写进了仓库
          assert d["datasource"].get("credential"), f"数据库口令没走环境变量：{d['datasource']}"
          # 接了模型，所以不再断言 disabled；改为钉住**成本护栏**：
          # 每日配额必须设置且不得放得太宽，否则被脚本刷爆
          q = d["guard"].get("daily_quota")
          assert isinstance(q, int) and 0 < q <= 500, f"对外实例的每日配额异常：{q}"
          PY

      - name: Page and its assets are actually served
        env:
          BASE: ${{ vars.ASKDB_BASE_URL || 'https://askdb.ragforge.net' }}
        run: |
          # 接口全绿而页面白屏，是这套部署最可能的失败形态：产物没提交、
          # 静态目录没挂上、入口把 /assets 漏了 —— 三种都没有一种会让
          # /api/health 变红。冒烟必须真去取一遍页面引用的每个资源。
          set -euo pipefail
          BASE="${BASE%/}"
          IFS='|' read -r CODE CTYPE <<<"$(curl --silent --show-error --max-time 20 \
            --retry 6 --retry-delay 5 -o /tmp/index.html -w '%{http_code}|%{content_type}' "${BASE}/")"
          # 状态码要单独看：出错页往往也是 text/html，只比对类型会把 500 放过去
          [[ "${CODE}" == "200" ]] || { echo "::error::首页返回 ${CODE}"; exit 1; }
          [[ "${CTYPE}" == *text/html* ]] || { echo "::error::首页 content-type 不对：${CTYPE}"; exit 1; }

          REFS="$(grep -o '/assets/[^"]\+' /tmp/index.html | sort -u)"
          [[ -n "${REFS}" ]] || { echo "::error::页面没有引用任何 /assets 资源 —— 线上跑的多半不是构建产物"; exit 1; }

          for REF in ${REFS}; do
            # 用 | 分隔而不是空格：content_type 自带 "; charset=utf-8"，
            # 按空格切会把字段错位，size 变成一段文本，比对时静默走偏
            IFS='|' read -r CODE CTYPE SIZE <<<"$(curl -s -o /dev/null --max-time 30 \
              -w '%{http_code}|%{content_type}|%{size_download}' "${BASE}${REF}")"
            echo "${REF} → ${CODE} ${CTYPE} ${SIZE}B"
            [[ "${CODE}" == "200" && "${SIZE}" -gt 0 ]] || { echo "::error::${REF} 取不到（${CODE}）"; exit 1; }
            case "${REF}" in
              *.js)  [[ "${CTYPE}" == *javascript* ]] || { echo "::error::${REF} 的 content-type 不对：${CTYPE}"; exit 1; };;
              *.css) [[ "${CTYPE}" == *css* ]]        || { echo "::error::${REF} 的 content-type 不对：${CTYPE}"; exit 1; };;
            esac
          done

      - name: Login capability is wired up
        env:
          BASE: ${{ vars.ASKDB_BASE_URL || 'https://askdb.ragforge.net' }}
        run: |
          # 登录要同时满足两条：配置里 auth.enabled 为真，**且**进程里有
          # ASKDB_SESSION_SECRET（askdb/auth.py 的 enabled()）。密钥来自 k8s Secret
          # askdb-auth，manifest 里是 optional —— 忘了建，服务照常起、页面照常开，
          # 只是登录整体关闭、前端连入口都不显示。又一次"全绿但功能没上线"。
          set -euo pipefail
          BASE="${BASE%/}"
          CODE="$(curl -s -o /tmp/me.json --max-time 20 -w '%{http_code}' "${BASE}/api/auth/me")"
          if [[ "${CODE}" != "200" ]]; then
            echo "::error::/api/auth/me 返回 ${CODE} —— 线上镜像里还没有登录能力"; exit 1
          fi
          python3 - /tmp/me.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["enabled"] is True, f"登录未启用 —— 多半是没建 askdb-auth Secret：{d}"
          # 2026-09-07 起 required 改回 false（未登录可读，见 config/public.yaml）。
          # 这里断言的是 false 而不是"随便什么值"：线上跑的必须是 public.yaml，
          # 挂错配置（比如挂成内网试点那份）同样是一次要红的事故。
          assert d["required"] is False, f"对外实例应为未登录可读，线上挂的配置不对：{d}"
          print("登录已启用，当前匿名可见范围：", d["scope"])
          PY
          # 配置开关为真只说明"打算开"。再打一次错口令：401 才说明登录这条路
          # 真的通到了账号表 —— 缺 ASKDB_SESSION_SECRET 时这里会是 404。
          # （/api/auth/demo 已随 61f4a8b「登录落地」下线，一键体验改为纯前端
          #   跳过登录，因此不再有 demo_accounts 这个字段可断言。）
          CODE="$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' \
            -X POST "${BASE}/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"owner","password":"ci-smoke-wrong-password"}')"
          [[ "${CODE}" == "401" ]] || {
            echo "::error::错口令登录返回 ${CODE}，期望 401 —— 登录路径没通"; exit 1; }

      - name: Anonymous can read, and the write gate is actually closed
        env:
          BASE: ${{ vars.ASKDB_BASE_URL || 'https://askdb.ragforge.net' }}
        run: |
          # 2026-09-07 required 改回 false 之后，这一步验的边界跟着换了一条：
          # 原来验"读也要登录"（匿名一律 401），现在验的是**读开、写关**。
          # 两个方向都要验，缺一个都会让一次事故看着像正常：
          #   · 只验写关：读门被谁改回 required 也不会红，而站点对访客全白
          #   · 只验读开：写门哪天失效，公网就能改数据源、改成员
          #
          # 不需要任何口令，所以它**无条件跑** —— 下面那步没有 secret 时会降级，
          # 这一步不会。
          set -euo pipefail
          BASE="${BASE%/}"

          # 读：匿名必须真的读得到。200 而不是 401/404 ——
          # 401 说明读门又被打开了，404 说明入口把整条路由挡掉了
          # （2026-08-25 放开内省之前就是 404），两者混一起会互相伪装。
          for p in /api/schema /api/introspect /api/selfcheck; do
            CODE="$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' "${BASE}${p}")"
            [[ "${CODE}" == "200" ]] || {
              echo "::error::${p} 匿名返回 ${CODE}，期望 200 —— 对外实例该让访客读得到"; exit 1; }
          done

          # 写：未登录一律拦下。POST /api/sources 走的是 server._gate_writes，
          # 中间件在路由之前跑，所以这个空 body **不会**落到任何处理函数上，
          # 线上不会因此多出一条数据源。
          CODE="$(curl -s -o /tmp/gate.json --max-time 20 -w '%{http_code}' \
            -X POST "${BASE}/api/sources" -H 'Content-Type: application/json' -d '{}')"
          [[ "${CODE}" == "401" ]] || {
            echo "::error::匿名写返回 ${CODE}，期望 401 —— 写门没关，公网能改配置"; exit 1; }
          # code 要看：login_required 才是"要登录"；login_unavailable 说明
          # 会话密钥没配、登录整体关闭，此时虽然也是 401，但没有人登得进来。
          grep -q '"code":"login_required"' /tmp/gate.json || {
            echo "::error::写门返回的不是 login_required：$(cat /tmp/gate.json)"; exit 1; }

      - name: Guardrail and default tenant, proven server-side
        env:
          BASE: ${{ vars.ASKDB_BASE_URL || 'https://askdb.ragforge.net' }}
        run: |
          # 这两件事原来靠"拿一个人类账号登录，再用 /api/sql 去试"。实例改成
          # required: true 之后那条路要求 CI 持有一份账号口令 —— 部署后的验证
          # 不该依赖任何人的凭证：口令会过期、会被改、会跟着人走，一旦对不上，
          # 验证就整段消失，而"验证消失"和"系统正常"在流水线上长得一模一样
          # （2026-09-06 就是这么红的）。结论改由服务端给：/api/health?probe=1。
          #
          # 放宽的只是两个布尔值，不是数据：写操作实探只回成败，租户探针只回
          # "有没有行"。探针默认不跑（页面加载调的是不带 probe 的那条），有独立限流。
          set -euo pipefail
          BASE="${BASE%/}"
          curl --fail --silent --show-error --max-time 30 \
            "${BASE}/api/health?probe=1" -o /tmp/probe.json
          python3 - /tmp/probe.json <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))["probe"]
          # 护栏：R-02 非只读语句。配置说"只读"不算数，要它真的拦下一条 DELETE
          assert p["write_blocked"] is True, f"护栏没拦住写操作：{p}"
          # 默认租户：2026-08-25 把 default_ctx 改成了库里不存在的组织，站点
          # 从此查什么都是 0 行，而且全链路不报错（护栏照常注入租户谓词，只是
          # 匹配不到行），冒烟一路全绿，三天后才由人肉发现。
          assert p["default_tenant_has_rows"] is True, \
              f"默认租户 org_id={p.get('org_id')} 在表 {p.get('table')} 上一行都没有 —— 页面等于查不到任何东西：{p}"
          print(f"实证通过：护栏拦写 ✓，默认租户 org_id={p['org_id']} 在 {p['table']} 上有数据 ✓")
          PY
