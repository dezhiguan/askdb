apiVersion: keel/v1
kind: Agent
metadata:
  name: askdb
  displayName: 问数
  owner: 数据平台组 / zhou
  category: data
spec:
  runtime:
    type: code
    language: python
    endpoint: http://askdb.agents.svc.cluster.local:8000
    liveness: k8s
  auth:
    audience: askdb
    roles:
    - analyst
  models:
    default: chat-default
    budget:
      dailyCny: 30
      maxSteps: 12
  tools:
  - name: search_schema
    access: read
    risk: low
  - name: get_table_schema
    access: read
    risk: low
  - name: execute_sql
    access: read
    risk: low
  - name: analyze_result
    access: read
    risk: low
  delegates: []
  guardrails:
    inputInjection: enforce
    grounding: shadow
    pii: mask
  audit:
    retentionDays: 180
    captureFields:
    - trace_id
    - ts
    - kind
    - thread_id
    - org_id
    - role
    - user
    - question
    - rejected_by
    - attempts
    - rows_returned
    - elapsed_ms
    - cost_cny
    - step_count
    - multi_step
    - source
    - source_name
    - sources
    - execution_mode
    - cached
    - saved_cny
    - saved_ms
  prompts:
    source: langfuse
    label: production
    items:
    - name: assess
      type: text
    - name: fast
      type: text
    - name: intent
      type: text
    - name: plan
      type: text
    - name: query-agent
      type: text
    - name: replan
      type: text
    - name: semantic
      type: text
    - name: sql
      type: text
    - name: supervisor-decide
      type: text
    - name: supervisor
      type: text
    - name: synthesizer
      type: text
    - name: verifier
      type: text
  eval:
    dataset: askdb/nl2sql
    evaluators:
    - answer_correctness
    - safety
    gate:
      minScore: 0.95
      maxRegression: 0.02
      byTag: true
