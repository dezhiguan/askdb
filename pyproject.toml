[project]
name = "askdb"
version = "0.1.0"
description = "可信数据问答 Agent —— 把自然语言转换为受控 SQL 并安全执行"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "langgraph>=0.3",
    # 检查点持久化（设计 §5）单独一个包，langgraph 主包不含。
    # 少了它 graph.build_graph() 直接 ImportError —— 失败样本原样复现、
    # 回放归因这些能力全部落空，属于主依赖而不是可选项。
    "langgraph-checkpoint-sqlite>=2.0",
    # 检查点的 PostgreSQL 后端（2026-09-09 起生产用它）。与 sqlite 那个
    # 并存而不是替换：本机开发、样例配置仍走文件，那时不该要求本地有库。
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    # LLM 观测（自托管 Langfuse，v2 服务端配 v2 SDK；import 路径在 v3 有变，锁大版本）
    "langfuse>=2.60,<3",
    "sqlglot>=25.0",
    "duckdb>=1.0",
    # 数据源注册表存在 PostgreSQL（askdb/sources.py）。**主依赖，不是可选**：
    # 没有它连"有哪些数据源"都读不出来，实例整个不可用 —— 与被查询的库
    # 是不是 PG 无关，纯 duckdb 部署同样要装。pool 走连接池：数据源在每条
    # 查询路径上都要读一次，裸连接会给每次问答加一次建连往返。
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    # 运行时添加的数据源若直接提交口令，用主密钥加密后落盘（sources.py）。
    # 此前只是 langchain 链路的传递依赖，现在是直接依赖，必须显式声明。
    "cryptography>=42",
    "rich>=13.7",
]

[project.optional-dependencies]
# 保留为兼容别名：psycopg 自 2026-09-06 起是主依赖（数据源注册表要用）。
# 不删是因为 CI 与部署文档里到处都是 ".[postgres,dev]"，删了会一起红。
postgres = []
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# 向量召回（schema_rag.mode: vector）。默认 keyword 模式用不到，故不入主依赖。
vectors = ["chromadb>=0.5"]
# MCP 无状态服务。仅在被其他 Agent 作为工具调用时需要。
mcp = ["mcp>=1.0"]
# 每日配额的共享计数。单副本部署用不到（退回本地文件计数），
# 多副本部署必装 —— 否则每个副本各数各的，上限被乘以副本数。
redis = ["redis>=5.0"]
# dev 装齐**全部可选能力** —— 测试要覆盖 MCP 与向量召回，
# 少装一个就会有一批用例静默 skip 或直接 collect 失败，而报告还是绿的。
dev = [
    "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
    "chromadb>=0.5", "mcp>=1.0", "redis>=5.0",
    "pytest>=8.0", "pytest-cov>=5.0",
]

[project.scripts]
askdb = "askdb.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["askdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 项目根必须在 sys.path 上：conftest 要 import data.seed 生成样例库，
# 而 data/ 不是被安装的包。用 `python -m pytest` 时当前目录会自动进
# sys.path，直接用 `pytest` 则不会 —— CI 上就是这么炸的。
# 写在这里，两种调用方式都稳。
pythonpath = ["."]
addopts = "-q --cov=askdb --cov=data --cov-report=term-missing --cov-fail-under=81"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
