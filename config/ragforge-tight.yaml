# ragforge 生产库 · **护栏回归验证**配置。
#
# 用途：让反思重试链路可复现地跑起来，用于验证 R-11 → reflect → R-14
# 这条回边是否仍按预期工作。**不用于对外服务。**
#
# 为什么需要单独一份：正常配置下反思重试几乎不触发 —— 实测 338 次评测调用
# 里只有 3 次（0.9%）。原因是 schema 全量注入后模型不编造字段，要么用真列、
# 要么直接拒答。链路是通的，只是平时用不上；而"平时用不上"和"坏了"在页面上
# 看起来一模一样，所以需要一个能主动把它逼出来的场景。
#
# 与 ragforge-prod.yaml 的唯一差异：
#   1. max_scan_rows 由 200000 压到 3000 —— documents 全表聚合预估扫描
#      约 41661 行，必然超阈值，干跑阶段被 R-11 打回并进入 reflect。
#   2. 审计与检查点单独落盘，不混进生产审计。
#
# 用法：
#   askdb ask "一共有多少个文档" -c config/ragforge-tight.yaml
#
# 预期观察到（三轮全部打回，最终诚实失败而非静默降级）：
#   ✕ dry_run   预估扫描 41,661 行，超过阈值 3,000
#   ✓ reflect   第 1 次重试：把真实错误回灌模型重新生成
#   ✓ generate_sql  第 2 轮重新生成
#   ✕ dry_run   …（同上，扫描量模型改不了）
#   ✓ reflect   第 2 次重试
#   ✓ generate_sql  第 3 轮重新生成
#   ✕ dry_run   …
#   ✓ finalize  已附最终 SQL 与判定链路   ← R-14 上限 2 次生效
#
# 注意这个场景里重试**救不回来** —— 全表计数的扫描量不是加个筛选条件就能降的。
# 这是正确行为：R-14 到上限即停并如实报错，不做静默降级（§4.5）。
# 想看"重试后成功"的情形，需要模型能据错误信息自我纠正的拦截（如 R-04 字段
# 不存在），而那类触发依赖模型当次是否恰好写错，无法稳定构造。
#
datasource:
  type: postgresql
  dsn: "host=127.0.0.1 port=15432 dbname=ragforge user=askdb_ro"
  password_env: ASKDB_PROD_PG_PASSWORD
  # dsn 指向的是隧道本地端口；真实库在这里。界面与评测出处按此显示，
  # 否则出处栏会写成 127.0.0.1，等于把最关键的一条信息说错。
  upstream: "8.163.30.216:5432"           # 云上主库，经本地 SSH 隧道 15432 转发

tenant:
  enabled: true
  column: org_id
  default_ctx: 316                   # 职场数据分享组织
  mode: rls_and_predicate            # 应用层 AST 改写 + 数据库 RLS，双层
  on_unresolved: reject

guard:
  # 主库场景：宁可查不出来，也不能把库拖慢
  max_rows: 500
  max_scan_rows: 3000                # 刻意压低：逼出 R-11 → reflect 回边
  statement_timeout_ms: 5000         # 与角色级 statement_timeout 一致
  max_retry: 2
  allow_select_star: false
  allowed_schemas: [public, main]   # R-06：其余 schema 与跨库引用一律拒绝
  deny_functions:
    - pg_read_file
    - pg_ls_dir
    - pg_read_binary_file
    - lo_import
    - lo_export
    - dblink
    - pg_sleep
    - query_to_xml
    - pg_stat_file

planner:
  # 多步是兜底路径不是默认路径：能用一条 SQL（含 CTE）表达的一律单步。
  # 默认关闭 —— 首轮消融的结论：F 组成本 +109%，多跳准确率未提升。
  # 按 §6.3 定下的规则「成本上升而多跳无收益则回退为默认关闭的开关」执行。
  # 需要多跳能力时显式打开。
  enabled: false
  max_steps: 3                       # R-16 总步数上限
  max_carry_rows: 50                 # R-15 中间结果规模上限，超限即收敛
  carry_columns_only: true           # 仅下传标识列，不下传整行（§5.3.2 / §10.1）
  cost_cap_tokens: 12000             # R-17 单次问答累计 token 上限，0 表示不限
  on_cap_reached: converge           # converge | fail —— 触顶后收敛作答并标注，不静默返回

schema_rag:
  mode: keyword
  top_k: 3
  max_k: 5
  token_budget: 1500
  # 以下仅 mode: vector 生效
  embedding_model: text-embedding-v4
  min_score: 0.35        # 相似度门槛。注意它**不是硬阈值**：设计 §3.2.3 要求
                         # 「召回 Top-K（默认 3）表」，所以过线的表不足 top_k 张时，
                         # 会按相似度补齐到 top_k —— 宁可多给一张，也不让模型无表可用。
                         # 想让它成为硬阈值，得先改设计文档里的 Top-K 约定。
  max_metrics: 2         # 口径是强约束（"必须用此定义"），塞多了会误导模型

llm:
  provider: deepseek
  base_url: "https://api.deepseek.com"
  model: deepseek-v4-flash
  temperature: 0
  api_key_env: DEEPSEEK_API_KEY
  price_input_per_1k: 0.001
  price_output_per_1k: 0.002
  thinking: false
  fallback:
    provider: dashscope
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: qwen-max
    api_key_env: DASHSCOPE_API_KEY

observability:
  audit_log: ./data/audit-ragforge-tight.jsonl
  checkpoint_db: ./data/checkpoints-ragforge-tight.sqlite
  daily_quota: 100                   # 主库上更保守

tables_file: ./config/ragforge-prod-tables.yaml
metrics_file: ./config/ragforge-prod-metrics.yaml
