# 对外开放的只读实例配置。
#
# 与其余配置的根本差别：**它连的是合成样例库，不是任何真实数据源。**
# data/sample.duckdb 由 data/seed.py 用固定随机种子生成，11.8 万行文档，
# 没有一条真实数据；任何人 clone 仓库跑一次 `python -m data.seed`
# 都能得到完全一样的库。因此这个实例即使完全开放，也没有数据可泄露。
#
# ---------------------------------------------------------------------------
# 关于成本控制
#
# askdb 不设账号体系（§1.1：数据库连接本身即权限边界），对外开放实例
# 无法区分调用方 —— 接了模型就等于任何人都能花部署方的钱。
# 因此这里用**四层**限制，任何单独一层都不够：
#
#   1. 便宜的模型      deepseek-v4-flash，入 ¥0.001 / 出 ¥0.002 每千 token，
#                      比 qwen-max（0.0024 / 0.0096）便宜约四倍
#   2. 每日总配额      daily_quota，在**任何模型调用之前**拦，超限一个 token 不花
#   3. 审计日志持久化  配额靠数当天的审计条数实现。日志写在 ./var（挂了卷），
#                      否则 Pod 一重启计数归零，配额形同虚设
#   4. 入口限流        nginx 对 /api/ask 单独限到 6r/min per IP（见 deploy/nginx-askdb.conf）——
#                      配额挡总量，限流挡"一个脚本几分钟刷光全天额度"
#
# 「直查 SQL」链路（护栏 → 改写 → 干跑 → 只读执行）不调模型、不受配额限制，
# 额度用光后它仍然可用 —— 而它恰好是这个项目最要紧的部分。
# ---------------------------------------------------------------------------
#
# 用法：
#   python -m data.seed                                   # 先生成样例库
#   python -m askdb.cli serve -c config/public.yaml       # 默认只听 127.0.0.1
#
# **不要用 --host 0.0.0.0 直接暴露公网。**前面必须有反向代理承担 HTTPS
# 与限流，见 deploy/README.md。

# 2026-09-03 按 @guandezhi 决定：云上实例直连 ragforge 生产主库，不再跑样例库。
#
# 这条改动推翻了本文件开头那段前提 —— 原来"即使完全开放也没有数据可泄露"，
# 靠的是连着合成库。现在库里是真数据，挡在公网与它之间的只剩三样：
#   1. 必须登录（auth.required: true，同日一并改）
#   2. 只读连接 + 护栏 R-01～R-17
#   3. org_id = 316 的租户谓词 + 库侧 RLS
# 少任何一条，这个实例就不该对外可达。
#
# 口令只走环境变量，云上由 k8s Secret 注入（见 deploy/k8s/askdb.yaml）。
datasource:
  type: postgresql
  # 走**内网**地址。实测：Server 3 的 pod 到 8.163.30.216:5432（公网）超时，
  # 到 172.25.90.183:5432（同 VPC 内网）通 —— 写公网地址推上去站点会直接挂，
  # 而症状是"数据源不可用"，很容易被当成库的问题去查。
  dsn: "host=172.25.90.183 port=5432 dbname=ragforge user=askdb_ro"
  password_env: ASKDB_PROD_PG_PASSWORD
  # 出处栏显示这台机器对外的身份 —— 内网 IP 对读的人没有意义，
  # 而"这组数字出自哪个库"正是这一栏存在的全部理由。
  upstream: "8.163.30.216:5432"

tenant:
  column: org_id
  # 职场数据分享组织。改默认租户前务必确认该组织在库里确实有数据，
  # 否则页面看着正常、结果永远为空，且不报任何错（护栏照常注入谓词，只是匹配不到行）。
  default_ctx: 316
  # 换成真实 PostgreSQL 后可以上双层：应用层 AST 改写 + 库侧 RLS。
  # 对外实例尤其需要库侧兜底 —— 应用层若被绕过，RLS 仍在。
  mode: rls_and_predicate
  on_unresolved: reject

guard:
  # 阈值比本机开发配置更紧：开放实例要防的是无意的重查询，
  # 不是恶意攻击（那由前置限流负责）。
  max_rows: 200                      # R-13，够看清结果形状即可
  max_scan_rows: 200000              # R-11
  statement_timeout_ms: 3000         # R-12，样例库上正常查询远低于此
  max_retry: 2                       # R-14（直查模式下用不上）
  allow_select_star: false           # R-05：改写为显式列，这一条最能看出改写效果
  deny_functions:                    # R-07
    - read_csv
    - read_parquet
    - read_json
    - glob
    - pg_read_file
    - pg_ls_dir
    - lo_import
    - dblink
    - pg_sleep

planner:
  enabled: false                     # 无模型，多步规划无从谈起
  max_steps: 3
  max_carry_rows: 50
  carry_columns_only: true
  cost_cap_tokens: 12000
  on_cap_reached: converge

schema_rag:
  mode: keyword                      # 不接模型，召回只用于页面展示 schema
  top_k: 3
  max_k: 5
  token_budget: 1500
  embedding_model: text-embedding-v4
  min_score: 0.35        # 相似度门槛。注意它**不是硬阈值**：设计 §3.2.3 要求
                         # 「召回 Top-K（默认 3）表」，所以过线的表不足 top_k 张时，
                         # 会按相似度补齐到 top_k —— 宁可多给一张，也不让模型无表可用。
                         # 想让它成为硬阈值，得先改设计文档里的 Top-K 约定。
  max_metrics: 2

llm:
  # 主模型选便宜的那个：对外实例的成本要按"被刷满"来估，不是按正常使用估。
  # 实测样例库上单次问答约 833+28 token ≈ ¥0.0009，
  # 200 次/天 ≈ ¥0.18/天 ≈ ¥5.4/月。
  provider: deepseek
  base_url: "https://api.deepseek.com"
  model: deepseek-v4-flash
  temperature: 0
  api_key_env: DEEPSEEK_API_KEY
  price_input_per_1k: 0.001
  price_output_per_1k: 0.002
  thinking: false

  # 备选只在主模型**调用失败**时兜底（限流 / 超时 / 厂商故障）。
  # 生成的 SQL 不对不切备选 —— 那是反思重试的职责。
  fallback:
    provider: dashscope
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: qwen-plus
    api_key_env: DASHSCOPE_API_KEY

observability:
  # 写在 ./var 而不是 ./data —— data 目录里是随镜像固化的样例库，
  # 往它上面挂卷会把样例库遮掉。var 单独挂卷，用于持久化审计日志。
  audit_log: ./var/audit-public.jsonl
  checkpoint_db: ./var/checkpoints-public.sqlite
  # 判定链路回放接口（设计说明 §5.2）。
  #
  # 2026-09-03 由 true 改回 false：它原来开着的**唯一理由**是"连的是合成样例库"，
  # 换成生产主库后那句话不成立了 —— 回放会返回 SQL 全文，而 SQL 里带着
  # 表名、列名与筛选条件，等于把库结构透给任何登录用户。
  # 字段白名单只挡住了结果行与注入提示词，挡不住 SQL 本身。
  #
  # 排查线上问题走命令行：askdb replay <trace_id> -c config/public.yaml
  replay_api: false
  # 每日**模型调用**上限（不是提问数）。一次提问会调好几次模型：
  # 多步规划每步一次生成 + 一次评估，反思重试再各来一次。按提问计会低估几倍。
  # 按 ¥0.0009/次算，500 次 ≈ ¥0.45/天 ≈ ¥13.5/月。
  daily_quota: 500

  quota:
    # 配了这个环境变量就用 Redis 计数，没配就退回本地文件。
    # **多副本部署必须配**：本地文件是每个副本各数各的，
    # 起 3 个副本实际上限就是 3 倍，配额直接失效。
    redis_url_env: ASKDB_REDIS_URL
    # 计数键前缀。带上实例名，避免公开实例与其他实例互相扣额度。
    key_prefix: askdb:quota:public
    # Redis 不可用时的取舍。block＝拒绝模型调用（默认）：
    # 配额是拿来兜成本的，后端一挂就无限放行等于最需要它时它不在。
    # 直查 SQL 链路不调模型、不过配额，Redis 挂了它照常可用。
    on_backend_error: block

tables_file: ./config/ragforge-prod-tables.yaml
metrics_file: ./config/ragforge-prod-metrics.yaml

# 2026-09-01 按 @guandezhi 决定放开。
#
# 保留原来的风险陈述，不是唱反调，是让后来改这行的人知道自己在改什么：
# 本实例无账号体系，开着这颗开关，**任何能打开页面的人**都能让部署方的
# 服务器向任意 host:port 发起连接，并从连接报错的差异里推断内网哪些端口开着。
#
# 放开后只剩两道约束，改动它们等于把最后的边界也一并去掉：
#   1. 出站建连限流 10 次 / 分钟（server._SOURCE_RL）
#   2. 未配 ASKDB_SECRET_KEY 时不接受明文口令，只能填环境变量名（sources.py）
datasources:
  allow_runtime_add: true

# ---------------------------------------------------------------------------
# 角色的生效边界
#
# 收窄语义：有效表 = 实例白名单 ∩ 这里列的表，行上限取小。**只能收窄，
# 不能放宽** —— 这里写一张白名单之外的表不会有任何效果。
#
# 匿名也是一个普通角色，不是绕过分支。它拿到的是最窄的一档：能体验查数，
# 但看不到文档明细与成本数据 —— 登录之后的差别因此是看得见的。
# ---------------------------------------------------------------------------
# 2026-09-03 表名跟着换库对齐：生产库里是 organizations / model_usage_daily，
# 样例库里是 orgs / model_usage。收窄取的是交集，写错的名字**静默失效** ——
# 改库前 DATA_OWNER 会莫名看不到成本表，而且不报任何错。
role_policies:
  ANONYMOUS:
    tables: [knowledge_bases, organizations]
    max_rows: 20
  QA:
    tables: [knowledge_bases, organizations, documents]
    max_rows: 50
  PRODUCT:
    # 不含 model_usage_daily：token 与成本是内部经营数据，产品角色看业务不看账
    tables: [knowledge_bases, organizations, documents]
    max_rows: 100
  DATA_OWNER:
    # 实例白名单内全部可见
    tables: [knowledge_bases, organizations, documents, retrieval_logs, model_usage_daily]
    max_rows: 200
  # SYS_ADMIN 不在这里 —— 它的"无数据权限"是内置默认，写在配置里反而像可改的

# ---------------------------------------------------------------------------
# 登录
#
# required: false —— **匿名可用，登录是可选的能力展示，不是门。**
# 这个实例的目的是让人看到护栏、审计与角色收窄；登录页是访客流失最大的
# 一处，拦在前面等于把要展示的东西全挡住了。
#
# 账号是固定的三个体验账号，没有注册、没有找回密码、没有短信。
# 口令**不入配置**，配置里只有 scrypt 哈希（askdb hash-password 生成）。
# demo: true 的账号同时开放一键体验 —— 那只跳过认证，不跳过授权：
# 体验账号拿到的仍是它自己角色的收窄配置，与口令登录完全同一条路径。
#
# 会话是无状态签名票，密钥走 ASKDB_SESSION_SECRET（askdb session-secret 生成）。
# 多副本必须共用同一把，否则表现为"刷新几次就掉线"。没配则登录整体关闭。
# ---------------------------------------------------------------------------
auth:
  enabled: true
  # 2026-09-03 由 false 改为 true。
  #
  # 连样例库时匿名可查是有意的：登录页是访客流失最大的一处，而那个实例
  # 要给人看的是护栏与审计，不是登录框。换成生产主库后这个权衡反过来了 ——
  # 库里是真数据，至少要让调用方在审计里有名有姓。
  required: true
  cookie_secure: true            # 入口强制 HTTPS
  accounts:
    - username: product
      display_name: 产品角色
      roles: [PRODUCT]
      demo: true
      note: 看业务数据，不看 token 与成本
      password_hash: "scrypt$16384$8$1$+hmZytSP/U/trvz4LhtjHQ==$26LFIdK3jO6mgr7ne6rJf53Jj1sOrQvM5S7fgs1U3Xk="
    - username: qa
      display_name: 测试角色
      roles: [QA]
      demo: true
      note: 可见表更少、返回行上限更低
      password_hash: "scrypt$16384$8$1$2ZasnZMURkCQs2bb8t1c9A==$f6gkHl+WtNPrMxgP8KmTu6RNl8EgH9KTA9m6qhP3iVs="
    - username: owner
      display_name: 数据负责人
      roles: [DATA_OWNER]
      demo: true
      note: 实例白名单内全部可见
      password_hash: "scrypt$16384$8$1$5eQ0nqqMH2JJl4MhJ5ZAPg==$Yq9nGQYvZZzojLlLDgfJG4brluHvVcb4LQLoh0iklyo="
