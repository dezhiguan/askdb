  # 的来意保留；「不带账号真的去查生产库」这半截收回来。
  # 上面 required 注释里"未登录即可只读查询"从本日起不再成立，
  # 匿名可读生产数据那个窟窿也随之关上（数据面仍未做行级收窄，
  # 收的是入口 —— 登录账号仍然全表可查，边界的性质没变，见上）。
