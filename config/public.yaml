  # 都不在本行 —— 改运行时源的表白名单（把上述表撤出可见面），
  # 或给运行时源配回租户列 + 库侧 RLS。
  #
  # 读门关掉之后仍然承重的几层，动之前先回到这里：
  #   1. 只读库账号（ragforge_ro_all / careermate_ro）+ 护栏 R-01～R-17
  #      （非只读语句在执行前被拦）
  #   2. 写门 server._gate_writes：未登录一律不能改配置（按 HTTP 方法拦，
  #      新增接口默认落在安全那边）。**这是现在唯一的写边界**
  #   3. 回放关闭（observability.replay_api: false）—— 它会返回 SQL 全文
  #   4. 成本：daily_quota + nginx 对 /api/ask 的 per-IP 限流
  required: false
  # 2026-09-10 按 @guandezhi 决定：**查询要登录**（/api/ask、/api/sql、
