# 对外开放的只读实例配置。
#
# 与其余配置的根本差别：**它连的是合成样例库，不是任何真实数据源。**
# data/sample.duckdb 由 data/seed.py 用固定随机种子生成，11.8 万行文档，
# 没有一条真实数据；任何人 clone 仓库跑一次 `python -m data.seed`
# 都能得到完全一样的库。因此这个实例即使完全开放，也没有数据可泄露。
#
# ---------------------------------------------------------------------------
# 关于成本控制
#
# askdb 不设账号体系（§1.1：数据库连接本身即权限边界），对外开放实例
# 无法区分调用方 —— 接了模型就等于任何人都能花部署方的钱。
# 因此这里用**四层**限制，任何单独一层都不够：
#
#   1. 便宜的模型      deepseek-v4-flash，入 ¥0.001 / 出 ¥0.002 每千 token，
#                      比 qwen-max（0.0024 / 0.0096）便宜约四倍
#   2. 每日总配额      daily_quota，在**任何模型调用之前**拦，超限一个 token 不花
#   3. 审计日志持久化  配额靠数当天的审计条数实现。日志写在 ./var（挂了卷），
#                      否则 Pod 一重启计数归零，配额形同虚设
#   4. 入口限流        nginx 对 /api/ask 单独限到 6r/min per IP（见 deploy/nginx-askdb.conf）——
#                      配额挡总量，限流挡"一个脚本几分钟刷光全天额度"
#
# 「直查 SQL」链路（护栏 → 改写 → 干跑 → 只读执行）不调模型、不受配额限制，
# 额度用光后它仍然可用 —— 而它恰好是这个项目最要紧的部分。
# ---------------------------------------------------------------------------
#
# 用法：
#   python -m data.seed                                   # 先生成样例库
#   python -m askdb.cli serve -c config/public.yaml       # 默认只听 127.0.0.1
#
# **不要用 --host 0.0.0.0 直接暴露公网。**前面必须有反向代理承担 HTTPS
# 与限流，见 deploy/README.md。

# 2026-09-03 按 @guandezhi 决定：云上实例直连 ragforge 生产主库，不再跑样例库。
#
# 2026-09-07 再改，按 @guandezhi 决定：**内置数据源整段撤掉**，ragforge 与
# careermate 两个库都走运行时注册表（askdb_sources 表）。这么改是为了让两个源
# 在界面上是同一种东西 —— 原来 ragforge 是配置里的内置源、别的都是注册表里的源，
# 两类卡片的行为不一致。
#
# **代价写在这里，别只看到"多了一个源"：**
#
#   · 运行时数据源一律不做租户隔离。sources.derive_config() 写死
#     tenant.enabled=False、每张表 tenant_exempt=True —— 一次结构扫描看不出
#     哪一列代表租户（documents 甚至是靠 kb_id 间接归属的），猜错就是越权，
#     所以它如实关闭，而不是假装在拦。
#   · 于是**下面那段 tenant 配置对查询不再起任何作用**。它留着只为 schema 页
#     展示，以及将来若配回内置源时不必从头写。看到 default_ctx: 316 就以为
#     线上还在按组织过滤 —— 这是这份配置现在最容易踩的坑。
#
# 行级边界就此消失，只剩表级白名单，而两个源都是全表开放。
# 2026-09-07 当天曾用 auth.required=true 把可见面收回到三个内建账号，同日按
# @guandezhi 决定又改回 false（见下方 auth 段）：这个站点要的是不带账号也能
# 完整走一遍链路。**所以现在没有任何一层在做行级收窄** —— ragforge 全部组织
# 与 careermate 生产库（含用户手机号、简历、对话、口令哈希）对公网匿名可读。
# 要收窄，改的是运行时源的表白名单或给它配回租户列，不是 auth 那一行。
#
# 口令只走环境变量，云上由 k8s Secret 注入（见 deploy/k8s/askdb.yaml）；
# 连接串存在 askdb_sources 表里，同样不进本文件。

tenant:
  column: org_id
  # 职场数据分享组织。改默认租户前务必确认该组织在库里确实有数据，
  # 否则页面看着正常、结果永远为空，且不报任何错（护栏照常注入谓词，只是匹配不到行）。
  default_ctx: 316
  # 换成真实 PostgreSQL 后可以上双层：应用层 AST 改写 + 库侧 RLS。
  # 对外实例尤其需要库侧兜底 —— 应用层若被绕过，RLS 仍在。
  mode: rls_and_predicate
  on_unresolved: reject

guard:
  # 阈值比本机开发配置更紧：开放实例要防的是无意的重查询，
  # 不是恶意攻击（那由前置限流负责）。
  max_rows: 200                      # R-13，够看清结果形状即可
  max_scan_rows: 200000              # R-11
  statement_timeout_ms: 3000         # R-12，样例库上正常查询远低于此
  max_retry: 2                       # R-14（直查模式下用不上）
  allow_select_star: false           # R-05：改写为显式列，这一条最能看出改写效果
  deny_functions:                    # R-07
    - read_csv
    - read_parquet
    - read_json
    - glob
    - pg_read_file
    - pg_ls_dir
    - lo_import
    - dblink
    - pg_sleep

planner:
  enabled: false                     # 无模型，多步规划无从谈起
  max_steps: 3
  max_carry_rows: 50
  carry_columns_only: true
  cost_cap_tokens: 12000
  on_cap_reached: converge

schema_rag:
  mode: keyword                      # 不接模型，召回只用于页面展示 schema
  top_k: 3
  max_k: 5
  token_budget: 1500
  embedding_model: text-embedding-v4
  min_score: 0.35        # 相似度门槛。注意它**不是硬阈值**：设计 §3.2.3 要求
                         # 「召回 Top-K（默认 3）表」，所以过线的表不足 top_k 张时，
                         # 会按相似度补齐到 top_k —— 宁可多给一张，也不让模型无表可用。
                         # 想让它成为硬阈值，得先改设计文档里的 Top-K 约定。
  max_metrics: 2

llm:
  # 主模型选便宜的那个：对外实例的成本要按"被刷满"来估，不是按正常使用估。
  #
  # 2026-09-06 由 deepseek-v4-flash 换为 qwen3.8-flash：单价 0.8/2.7 对
  # 1/2（元/百万 Token），同档位里最便宜的一个，且代次更新。
  # 口径按 1809 条真实审计（data/audit*.jsonl）重算，不再用早先那个偏乐观的
  # 833+28：实测均值 in 2651 / out 102，含 7% 的重试；对外样例库这一档约
  # in 900 / out 140 ≈ ¥0.0011/次，200 次/天 ≈ ¥6.6/月。
  provider: dashscope
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: qwen3.8-flash
  temperature: 0
  api_key_env: DASHSCOPE_API_KEY
  price_input_per_1k: 0.0008        # 0.8 元/百万 Token（2026-09-06 核对官方单价）
  price_output_per_1k: 0.0027       # 2.7 元/百万 Token
  # 百炼的上下文缓存要显式创建，命中按标准输入价的 10% 计。实测本链路
  # cache_read 恒为 0（没建显式缓存），所以这个价目前用不上，写在这里是为了
  # 一旦启用显式缓存，账立刻就是对的，不必回头再改代码。
  price_cached_input_per_1k: 0.00008
  # 百炼无峰谷计费 —— 不配 peak_windows，倍率恒为 1.0。
  thinking: false                   # 该模型默认开思考，必须显式关（见 llm.py _build）

  # 备选只在主模型**调用失败**时兜底（限流 / 超时 / 厂商故障）。
  # 生成的 SQL 不对不切备选 —— 那是反思重试的职责。
  fallback:
    # 备选必须换一家厂商：主模型已在百炼上，备选再挂百炼的话，
    # 百炼整体故障时两级一起挂，这条兜底等于不存在。
    provider: deepseek
    base_url: "https://api.deepseek.com"
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    # DeepSeek 直连单价（官网 2026-09-06 核对）。备选的单价必须写全：
    # 兜底触发时按**这里**结算，不再沿用主模型的价。
    # 按高峰填，空闲由 offpeak_multiplier 向下打折 —— 漏配时偏贵不偏便宜。
    price_input_per_1k: 0.003          # 未命中：高峰 3 元/1M（空闲 1.5）
    price_output_per_1k: 0.009         # 高峰 9 元/1M（空闲 4.5）
    price_cached_input_per_1k: 0.0001  # 命中：高峰 0.10 元/1M（空闲 0.05）
    offpeak_multiplier: 0.5
    peak_windows: ["09:00-12:00", "14:00-18:00"]   # 北京时间
    peak_weekdays_only: true
    peak_utc_offset_hours: 8

observability:
  # 写在 ./var 而不是 ./data —— data 目录里是随镜像固化的样例库，
  # 往它上面挂卷会把样例库遮掉。var 单独挂卷，用于持久化审计日志。
  audit_log: ./var/audit-public.jsonl
  checkpoint_db: ./var/checkpoints-public.sqlite
  # 判定链路回放接口（设计说明 §5.2）。
  #
  # 2026-09-03 由 true 改回 false：它原来开着的**唯一理由**是"连的是合成样例库"，
  # 换成生产主库后那句话不成立了 —— 回放会返回 SQL 全文，而 SQL 里带着
  # 表名、列名与筛选条件，等于把库结构透出去 ——
  # 2026-09-07 起未登录也能读，「透给谁」从"任何登录用户"变成了"任何访客"，
  # 这条只会更该关。
  # 字段白名单只挡住了结果行与注入提示词，挡不住 SQL 本身。
  #
  # 排查线上问题走命令行：askdb replay <trace_id> -c config/public.yaml
  replay_api: false
  # 每日**模型调用**上限（不是提问数）。一次提问会调好几次模型：
  # 多步规划每步一次生成 + 一次评估，反思重试再各来一次。按提问计会低估几倍。
  # 按 ¥0.0009/次算，500 次 ≈ ¥0.45/天 ≈ ¥13.5/月。
  daily_quota: 500

  quota:
    # 配了这个环境变量就用 Redis 计数，没配就退回本地文件。
    # **多副本部署必须配**：本地文件是每个副本各数各的，
    # 起 3 个副本实际上限就是 3 倍，配额直接失效。
    redis_url_env: ASKDB_REDIS_URL
    # 计数键前缀。带上实例名，避免公开实例与其他实例互相扣额度。
    key_prefix: askdb:quota:public
    # Redis 不可用时的取舍。block＝拒绝模型调用（默认）：
    # 配额是拿来兜成本的，后端一挂就无限放行等于最需要它时它不在。
    # 直查 SQL 链路不调模型、不过配额，Redis 挂了它照常可用。
    on_backend_error: block

tables_file: ./config/ragforge-prod-tables.yaml
metrics_file: ./config/ragforge-prod-metrics.yaml

# 2026-09-01 按 @guandezhi 决定放开。
#
# 保留原来的风险陈述，不是唱反调，是让后来改这行的人知道自己在改什么：
# 本实例无账号体系，开着这颗开关，**任何能打开页面的人**都能让部署方的
# 服务器向任意 host:port 发起连接，并从连接报错的差异里推断内网哪些端口开着。
#
# 放开后只剩两道约束，改动它们等于把最后的边界也一并去掉：
#   1. 出站建连限流 10 次 / 分钟（server._SOURCE_RL）
#   2. 未配 ASKDB_SECRET_KEY 时不接受明文口令，只能填环境变量名（sources.py）
datasources:
  allow_runtime_add: true

# ---------------------------------------------------------------------------
# 角色的生效边界
#
# 匿名是一个普通角色，不是绕过分支。它与登录用户看到的东西**完全一样**
# （2026-09-06 产品决定），登录带来的差别只有一条：能不能写。
#
# 2026-09-06：**此处原有 role_policies，已整块撤掉**（产品决定）。
#
# 它按角色收窄可见表与行上限（匿名 2 张表 20 行 … 数据负责人 5 张表 200 行），
# 与「所有角色看到的内容完全一样」直接冲突，而且是这套差别里最实质的一处 ——
# 能力位只决定进不进得了页面，这里决定查得到查不到。
#
# 机制本身没删：identity.policy_for 仍读这个键，narrow() 仍保证只能收窄
# 不能放宽。要给某个部署收紧可见面，在这里写回来即可；但那是一个会让角色
# 之间重新出现差别的决定，别顺手做。
auth:
  enabled: true
  # 2026-09-07 当天三改：true → false → true → **false（本行，最终态）**，
  # 前两版的理由都已不适用，别照着上面某一版读。
  #
  # 最后这次由 @guandezhi 明确决定：对外实例与本机方案一致 —— 未登录即可
  # 只读查询，登录页上的「一键体验」（跳过登录）因此回来。这是产品决定：
  # 站点的来意就是让人不带账号完整走一遍链路，而 required=true 时那个入口
  # 点了也进不去（后端 401），等于把来意挡在门外。
  #
  # **这次单独回滚了这一条，"撤掉内置数据源"保持不变**，所以下面这段必须
  # 原样记着，不许被读成"和 9 月 6 日以前一样"：
  #
  #   运行时源写死不做租户隔离（sources.derive_config），两个源又都是全表
  #   开放。于是匿名可读的实际范围是 **ragforge 全部组织的数据 + careermate
  #   生产库的全部数据**，含注册用户手机号、简历全文、与 agent 的完整对话、
  #   口令哈希。这些数据的主体是注册用户，不是部署方。
  #
  # 也就是说：行级边界不是"换个位置补回来了"，是没有了。要收窄只有两条路，
  # 都不在本行 —— 改运行时源的表白名单（把上述表撤出可见面），
  # 或给运行时源配回租户列 + 库侧 RLS。
  #
  # 读门关掉之后仍然承重的几层，动之前先回到这里：
  #   1. 只读库账号（ragforge_ro_all / careermate_ro）+ 护栏 R-01～R-17
  #      （非只读语句在执行前被拦）
  #   2. 写门 server._gate_writes：未登录一律不能改配置（按 HTTP 方法拦，
  #      新增接口默认落在安全那边）。**这是现在唯一的写边界**
  #   3. 回放关闭（observability.replay_api: false）—— 它会返回 SQL 全文
  #   4. 成本：daily_quota + nginx 对 /api/ask 的 per-IP 限流
  required: false
  cookie_secure: true            # 入口强制 HTTPS
  accounts:
    - username: product
      display_name: 产品角色
      roles: [PRODUCT]
      note: 看业务数据，不看 token 与成本
      password_hash: "scrypt$16384$8$1$+hmZytSP/U/trvz4LhtjHQ==$26LFIdK3jO6mgr7ne6rJf53Jj1sOrQvM5S7fgs1U3Xk="
    - username: qa
      display_name: 测试角色
      roles: [QA]
      note: 可见表更少、返回行上限更低
      password_hash: "scrypt$16384$8$1$2ZasnZMURkCQs2bb8t1c9A==$f6gkHl+WtNPrMxgP8KmTu6RNl8EgH9KTA9m6qhP3iVs="
    - username: owner
      display_name: 数据负责人
      roles: [DATA_OWNER]
      note: 实例白名单内全部可见
      password_hash: "scrypt$16384$8$1$5eQ0nqqMH2JJl4MhJ5ZAPg==$Yq9nGQYvZZzojLlLDgfJG4brluHvVcb4LQLoh0iklyo="
