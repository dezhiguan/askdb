# 对外开放的只读实例配置。
#
# 与其余配置的根本差别：**它连的是合成样例库，不是任何真实数据源。**
# data/sample.duckdb 由 data/seed.py 用固定随机种子生成，11.8 万行文档，
# 没有一条真实数据；任何人 clone 仓库跑一次 `python -m data.seed`
# 都能得到完全一样的库。因此这个实例即使完全开放，也没有数据可泄露。
#
# ---------------------------------------------------------------------------
# 关于成本控制
#
# askdb 不设账号体系（§1.1：数据库连接本身即权限边界），对外开放实例
# 无法区分调用方 —— 接了模型就等于任何人都能花部署方的钱。
# 因此这里用**四层**限制，任何单独一层都不够：
#
#   1. 便宜的模型      deepseek-v4-flash，入 ¥0.001 / 出 ¥0.002 每千 token，
#                      比 qwen-max（0.0024 / 0.0096）便宜约四倍
#   2. 每日总配额      daily_quota，在**任何模型调用之前**拦，超限一个 token 不花
#   3. 审计日志持久化  配额靠数当天的审计条数实现。日志写在 ./var（挂了卷），
#                      否则 Pod 一重启计数归零，配额形同虚设
#   4. 入口限流        nginx 对 /api/ask 单独限到 6r/min per IP（见 deploy/nginx-askdb.conf）——
#                      配额挡总量，限流挡"一个脚本几分钟刷光全天额度"
#
# 「直查 SQL」链路（护栏 → 改写 → 干跑 → 只读执行）不调模型、不受配额限制，
# 额度用光后它仍然可用 —— 而它恰好是这个项目最要紧的部分。
# ---------------------------------------------------------------------------
#
# 用法：
#   python -m data.seed                                   # 先生成样例库
#   python -m askdb.cli serve -c config/public.yaml       # 默认只听 127.0.0.1
#
# **不要用 --host 0.0.0.0 直接暴露公网。**前面必须有反向代理承担 HTTPS
# 与限流，见 deploy/README.md。

datasource:
  type: duckdb
  path: ./data/sample.duckdb
  read_only: true

tenant:
  column: org_id
  # 2026-08-25 按运营要求默认 316。2026-08-28 补上了对应的样例数据 ——
  # 在此之前样例库只有 org 65/66/67，默认租户下任何查询都恒返回 0 行。
  # 改默认租户时务必确认 data/seed.py 里该组织有数据，否则页面看着正常、
  # 结果永远为空，且不报任何错（护栏照常注入谓词，只是匹配不到行）。
  default_ctx: 316
  mode: predicate                    # DuckDB 无 RLS，只有应用层改写这一层
  on_unresolved: reject

guard:
  # 阈值比本机开发配置更紧：开放实例要防的是无意的重查询，
  # 不是恶意攻击（那由前置限流负责）。
  max_rows: 200                      # R-13，够看清结果形状即可
  max_scan_rows: 200000              # R-11
  statement_timeout_ms: 3000         # R-12，样例库上正常查询远低于此
  max_retry: 2                       # R-14（直查模式下用不上）
  allow_select_star: false           # R-05：改写为显式列，这一条最能看出改写效果
  deny_functions:                    # R-07
    - read_csv
    - read_parquet
    - read_json
    - glob
    - pg_read_file
    - pg_ls_dir
    - lo_import
    - dblink
    - pg_sleep

planner:
  enabled: false                     # 无模型，多步规划无从谈起
  max_steps: 3
  max_carry_rows: 50
  carry_columns_only: true
  cost_cap_tokens: 12000
  on_cap_reached: converge

schema_rag:
  mode: keyword                      # 不接模型，召回只用于页面展示 schema
  top_k: 3
  max_k: 5
  token_budget: 1500
  embedding_model: text-embedding-v4
  min_score: 0.35        # 相似度门槛。注意它**不是硬阈值**：设计 §3.2.3 要求
                         # 「召回 Top-K（默认 3）表」，所以过线的表不足 top_k 张时，
                         # 会按相似度补齐到 top_k —— 宁可多给一张，也不让模型无表可用。
                         # 想让它成为硬阈值，得先改设计文档里的 Top-K 约定。
  max_metrics: 2

llm:
  # 主模型选便宜的那个：对外实例的成本要按"被刷满"来估，不是按正常使用估。
  # 实测样例库上单次问答约 833+28 token ≈ ¥0.0009，
  # 200 次/天 ≈ ¥0.18/天 ≈ ¥5.4/月。
  provider: deepseek
  base_url: "https://api.deepseek.com"
  model: deepseek-v4-flash
  temperature: 0
  api_key_env: DEEPSEEK_API_KEY
  price_input_per_1k: 0.001
  price_output_per_1k: 0.002
  thinking: false

  # 备选只在主模型**调用失败**时兜底（限流 / 超时 / 厂商故障）。
  # 生成的 SQL 不对不切备选 —— 那是反思重试的职责。
  fallback:
    provider: dashscope
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: qwen-plus
    api_key_env: DASHSCOPE_API_KEY

observability:
  # 写在 ./var 而不是 ./data —— data 目录里是随镜像固化的样例库，
  # 往它上面挂卷会把样例库遮掉。var 单独挂卷，用于持久化审计日志。
  audit_log: ./var/audit-public.jsonl
  checkpoint_db: ./var/checkpoints-public.sqlite
  # 判定链路回放接口（设计说明 §5.2）：对外实例连的是合成样例库，
  # 且字段白名单已挡住结果行，可以开。连真实数据源的配置保持默认关。
  replay_api: true
  # 每日**模型调用**上限（不是提问数）。一次提问会调好几次模型：
  # 多步规划每步一次生成 + 一次评估，反思重试再各来一次。按提问计会低估几倍。
  # 按 ¥0.0009/次算，500 次 ≈ ¥0.45/天 ≈ ¥13.5/月。
  daily_quota: 500

  quota:
    # 配了这个环境变量就用 Redis 计数，没配就退回本地文件。
    # **多副本部署必须配**：本地文件是每个副本各数各的，
    # 起 3 个副本实际上限就是 3 倍，配额直接失效。
    redis_url_env: ASKDB_REDIS_URL
    # 计数键前缀。带上实例名，避免公开实例与其他实例互相扣额度。
    key_prefix: askdb:quota:public
    # Redis 不可用时的取舍。block＝拒绝模型调用（默认）：
    # 配额是拿来兜成本的，后端一挂就无限放行等于最需要它时它不在。
    # 直查 SQL 链路不调模型、不过配额，Redis 挂了它照常可用。
    on_backend_error: block

tables_file: ./config/tables.yaml
metrics_file: ./config/metrics.yaml

# 对外开放实例：**必须关闭**。
# 开着等于给出一个无鉴权的出站建连入口 —— 任何人都能让部署方的服务器
# 去连任意 host:port，并从连接报错的差异里推断内网哪些端口开着。
datasources:
  allow_runtime_add: false
