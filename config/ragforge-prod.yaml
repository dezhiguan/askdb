# 接入云上 ragforge 库（8.163.30.216），经 SSH 本地端口转发。
#
# ⚠️ 该实例无只读副本（pg_is_in_recovery=false，复制槽 0），这是**主库直连**。
#    技术设计说明书 §8 将此列为禁止项，本次为使用方明确要求后的例外。
#    因此所有阈值都比本机开发库更严，并且只开放 5 张表。
#
# 用法：
#   askdb check -c config/ragforge-prod.yaml
#   askdb serve -c config/ragforge-prod.yaml
#
# 撤销：ssh root@8.163.30.216 'docker exec -i ragforge-postgres \
#         psql -U ragforge -d ragforge' < scripts/prod_readonly_rollback.sql
#
# ---------------------------------------------------------------------------
# 2026-09-06：**默认数据源已撤掉**（产品决定）。
#
# 原来这里写着一条经 SSH 隧道直连云上主库的 datasource：
#   dsn: host=127.0.0.1 port=15432 dbname=ragforge user=askdb_ro
#   upstream: 8.163.30.216:5432   # 隧道 ssh -N -L 15432:127.0.0.1:5432 root@…
# 隧道没起来时它在数据源页上是一张永远「不可用」的卡，而那正是这个实例
# 最常见的状态。
#
# 因此本实例**没有默认数据源**：查询必须显式指定一个运行时数据源
# （config.has_default_source 支持这种部署，不带源的查询直接被拒，
#  不会悄悄落到某个"碰巧还在配置里"的库上）。
# 下面的租户、护栏阈值与表白名单仍按主库场景从严，因为运行时源连的
# 很可能就是同一个库。
# ---------------------------------------------------------------------------

tenant:
  enabled: true
  column: org_id
  default_ctx: 316                   # 职场数据分享组织
  mode: rls_and_predicate            # 应用层 AST 改写 + 数据库 RLS，双层
  on_unresolved: reject

guard:
  # 主库场景：宁可查不出来，也不能把库拖慢
  max_rows: 500
  max_scan_rows: 200000              # documents 全表 86,546 行，够用；再大的一律打回
  statement_timeout_ms: 5000         # 与角色级 statement_timeout 一致
  max_retry: 2
  allow_select_star: false
  allowed_schemas: [public, main]   # R-06：其余 schema 与跨库引用一律拒绝
  deny_functions:
    - pg_read_file
    - pg_ls_dir
    - pg_read_binary_file
    - lo_import
    - lo_export
    - dblink
    - pg_sleep
    - query_to_xml
    - pg_stat_file

planner:
  # 多步是兜底路径不是默认路径：能用一条 SQL（含 CTE）表达的一律单步。
  # 默认关闭 —— 首轮消融的结论：F 组成本 +109%，多跳准确率未提升。
  # 按 §6.3 定下的规则「成本上升而多跳无收益则回退为默认关闭的开关」执行。
  # 需要多跳能力时显式打开。
  enabled: false
  max_steps: 3                       # R-16 总步数上限
  max_carry_rows: 50                 # R-15 中间结果规模上限，超限即收敛
  carry_columns_only: true           # 仅下传标识列，不下传整行（§5.3.2 / §10.1）
  cost_cap_tokens: 12000             # R-17 单次问答累计 token 上限，0 表示不限
  on_cap_reached: converge           # converge | fail —— 触顶后收敛作答并标注，不静默返回

schema_rag:
  mode: keyword
  top_k: 3
  max_k: 5
  token_budget: 1500
  # 以下仅 mode: vector 生效
  embedding_model: text-embedding-v4
  min_score: 0.35        # 相似度门槛。注意它**不是硬阈值**：设计 §3.2.3 要求
                         # 「召回 Top-K（默认 3）表」，所以过线的表不足 top_k 张时，
                         # 会按相似度补齐到 top_k —— 宁可多给一张，也不让模型无表可用。
                         # 想让它成为硬阈值，得先改设计文档里的 Top-K 约定。
  max_metrics: 2         # 口径是强约束（"必须用此定义"），塞多了会误导模型

llm:
  provider: dashscope
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: qwen3.8-flash
  temperature: 0
  api_key_env: DASHSCOPE_API_KEY
  price_input_per_1k: 0.0008        # 0.8 元/百万 Token（2026-09-06 核对官方单价）
  price_output_per_1k: 0.0027       # 2.7 元/百万 Token
  # 百炼的上下文缓存要显式创建，命中按标准输入价的 10% 计。实测本链路
  # cache_read 恒为 0（没建显式缓存），所以这个价目前用不上，写在这里是为了
  # 一旦启用显式缓存，账立刻就是对的，不必回头再改代码。
  price_cached_input_per_1k: 0.00008
  # 百炼无峰谷计费 —— 不配 peak_windows，倍率恒为 1.0。
  thinking: false                   # 该模型默认开思考，必须显式关（见 llm.py _build）
  fallback:
    provider: deepseek
    base_url: "https://api.deepseek.com"
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    # DeepSeek 直连单价（官网 2026-09-06 核对）。备选的单价必须写全：
    # 兜底触发时按**这里**结算，不再沿用主模型的价。
    # 按高峰填，空闲由 offpeak_multiplier 向下打折 —— 漏配时偏贵不偏便宜。
    price_input_per_1k: 0.003          # 未命中：高峰 3 元/1M（空闲 1.5）
    price_output_per_1k: 0.009         # 高峰 9 元/1M（空闲 4.5）
    price_cached_input_per_1k: 0.0001  # 命中：高峰 0.10 元/1M（空闲 0.05）
    offpeak_multiplier: 0.5
    peak_windows: ["09:00-12:00", "14:00-18:00"]   # 北京时间
    peak_weekdays_only: true
    peak_utc_offset_hours: 8

observability:
  audit_log: ./data/audit-ragforge-prod.jsonl
  checkpoint_db: ./data/checkpoints-ragforge-prod.sqlite
  # 口径是**模型调用次数**，不是提问数：一次提问会调好几次模型
  # （多步规划每步一次生成 + 一次评估，反思重试再各来一次）。
  # 数字按旧口径乘 3 折算，保持实际可用量不变。
  daily_quota: 300                   # 主库上更保守

tables_file: ./config/ragforge-prod-tables.yaml
metrics_file: ./config/ragforge-prod-metrics.yaml

# ---------------------------------------------------------------------------
# 2026-09-06 补：登录、角色收窄、身份库。
#
# 这三段原本只在 config/ragforge.yaml 与 config/public.yaml 里有，这份主库配置
# 漏了 auth 段 —— auth.enabled(cfg) 是「配置里开 且 有会话密钥」两个条件相与，
# 少一个就整体 fail-closed，前端显示「登录未启用」。
# 主库连的是真数据，比开发库更需要审计里有名有姓，不该是三份配置里唯一关着的。
#
# 账号名单与口令哈希与 config/ragforge.yaml、config/askdb.yaml 是同一份 ——
# 账号跟着配置文件分裂，会出现「在这台登得进、换一台就说账号不存在」。
# 会话密钥走 ASKDB_SESSION_SECRET（见 .env），不入配置。
# ---------------------------------------------------------------------------

# 2026-09-06：**此处原有 role_policies，已整块撤掉**（产品决定）。
#
# 它按角色收窄可见表与行上限（匿名 2 张表 20 行 … 数据负责人 5 张表 200 行），
# 与「所有角色看到的内容完全一样」直接冲突，而且是这套差别里最实质的一处 ——
# 能力位只决定进不进得了页面，这里决定查得到查不到。
#
# 机制本身没删：identity.policy_for 仍读这个键，narrow() 仍保证只能收窄
# 不能放宽。要给某个部署收紧可见面，在这里写回来即可；但那是一个会让角色
