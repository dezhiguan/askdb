# 接入本机 ragforge 开发库（Postgres.app，非容器）。
#
# 用法：askdb check -c config/ragforge.yaml
#       askdb serve -c config/ragforge.yaml
#
# 只连本机开发库。按技术设计说明书 §8：生产主库禁止连接，
# 线上只允许连只读副本，且需满足 8 项准入条件。

datasource:
  type: postgresql
  dsn: "host=127.0.0.1 port=5432 dbname=ragforge user=askdb_ro"
  password_env: ASKDB_PG_PASSWORD    # 密码只走环境变量，不落配置文件

tenant:
  column: org_id
  default_ctx: 1                     # 广州日不落科技有限公司；用 --org 覆盖
  mode: rls_and_predicate            # 应用层 AST 改写 + 数据库行级安全，双层
  on_unresolved: reject

guard:
  max_rows: 1000
  max_scan_rows: 500000
  statement_timeout_ms: 8000
  max_retry: 2
  allow_select_star: false
  allowed_schemas: [public, main]   # R-06：其余 schema 与跨库引用一律拒绝
  deny_functions:
    - pg_read_file
    - pg_ls_dir
    - pg_read_binary_file
    - lo_import
    - lo_export
    - dblink
    - pg_sleep
    - query_to_xml

planner:
  # 多步是兜底路径不是默认路径：能用一条 SQL（含 CTE）表达的一律单步。
  # 默认关闭 —— 首轮消融的结论：F 组成本 +109%，多跳准确率未提升。
  # 按 §6.3 定下的规则「成本上升而多跳无收益则回退为默认关闭的开关」执行。
  # 需要多跳能力时显式打开。
  enabled: false
  max_steps: 3                       # R-16 总步数上限
  max_carry_rows: 50                 # R-15 中间结果规模上限，超限即收敛
  carry_columns_only: true           # 仅下传标识列，不下传整行（§5.3.2 / §10.1）
  cost_cap_tokens: 12000             # R-17 单次问答累计 token 上限，0 表示不限
  on_cap_reached: converge           # converge | fail —— 触顶后收敛作答并标注，不静默返回

schema_rag:
  mode: keyword
  top_k: 3
  max_k: 5
  token_budget: 1500
  # 以下仅 mode: vector 生效
  embedding_model: text-embedding-v4
  min_score: 0.35        # 相似度门槛。注意它**不是硬阈值**：设计 §3.2.3 要求
                         # 「召回 Top-K（默认 3）表」，所以过线的表不足 top_k 张时，
                         # 会按相似度补齐到 top_k —— 宁可多给一张，也不让模型无表可用。
                         # 想让它成为硬阈值，得先改设计文档里的 Top-K 约定。
  max_metrics: 2         # 口径是强约束（"必须用此定义"），塞多了会误导模型

llm:
  provider: deepseek
  base_url: "https://api.deepseek.com"
  model: deepseek-v4-flash
  temperature: 0
  api_key_env: DEEPSEEK_API_KEY
  price_input_per_1k: 0.001
  price_output_per_1k: 0.002
  thinking: false
  fallback:
    provider: dashscope
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: qwen-max
    api_key_env: DASHSCOPE_API_KEY

observability:
  replay_api: true    # 本机开发：判定链路可回放
  audit_log: ./data/audit-ragforge.jsonl
  checkpoint_db: ./data/checkpoints-ragforge.sqlite
  # 口径是**模型调用次数**，不是提问数：一次提问会调好几次模型
  # （多步规划每步一次生成 + 一次评估，反思重试再各来一次）。
  # 数字按旧口径乘 3 折算，保持实际可用量不变。
  daily_quota: 600

tables_file: ./config/ragforge-tables.yaml
metrics_file: ./config/ragforge-metrics.yaml

# ---------------------------------------------------------------------------
# 本机开发：把登录、角色、身份、回放一并打开
#
# 这几段原本只配在 public.yaml，导致本地跑起来看不到登录与角色收窄 ——
# 「本地没有的功能」和「本地没配的功能」长得一模一样，已经因此误判过一次。
# 开发配置就该能跑通全部功能。
# ---------------------------------------------------------------------------

# 收窄语义：有效表 = 实例白名单 ∩ 这里列的表，行上限取小。只能收窄不能放宽。
role_policies:
  ANONYMOUS:
    tables: [organizations, knowledge_bases]
    max_rows: 20
  QA:
    tables: [organizations, knowledge_bases, documents]
    max_rows: 50
  PRODUCT:
    # 不含 model_usage_daily：token 与成本是内部经营数据
    tables: [organizations, knowledge_bases, documents, retrieval_logs]
    max_rows: 100
  DATA_OWNER:
    tables: [organizations, knowledge_bases, documents, retrieval_logs, model_usage_daily]
    max_rows: 200

auth:
  enabled: true
  required: false          # 匿名可用，登录只放宽可见范围
  cookie_secure: false     # 本地 http 调试
  accounts:
    - username: product
      display_name: 产品角色
      roles: [PRODUCT]
      demo: true
      note: 看业务数据，不看 token 与成本
      password_hash: "scrypt$16384$8$1$BXRPaoFjVz+u5NN5hPIZ0w==$m8kDCduTe+hR4xMIEAR8R8WPQJmfdG2vY6EFwEFsSGc="
    - username: qa
      display_name: 测试角色
      roles: [QA]
      demo: true
      note: 可见表更少、返回行上限更低
      password_hash: "scrypt$16384$8$1$eLDdXb9uFjW/CfrHBgfQGg==$rq3O/fMjtndHe6sevcR7obmmWYYq/zi2MbPmY30brAU="
    - username: owner
      display_name: 数据负责人
      roles: [DATA_OWNER]
      demo: true
      note: 实例白名单内全部可见
      password_hash: "scrypt$16384$8$1$39p9hx2CGTD3qLeQFcsSQQ==$w5wEOTvqtU/64iFbEG3Cda6D28Ck0jAOJd8tnPD+8dQ="

identity:
  # 连接串走 ASKDB_IDENTITY_DSN（见 .env），不写进仓库
  enabled: true
  password_env: ASKDB_IDENTITY_PG_PASSWORD
