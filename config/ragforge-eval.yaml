# ragforge 生产库 · **评测专用**配置。
#
# 与 ragforge-prod.yaml 的唯一差异是三处，其余（连接、白名单、口径、
# 护栏阈值）必须逐字相同 —— 评测若跑在比生产更宽松的护栏下，测出的
# 成绩就不代表生产链路。
#
#   1. daily_quota 提高到 3000：一轮六组消融 + 盲测约 400 次调用，
#      生产配置的 100 会在中途触顶，把剩余题目判为 QUOTA 失败、污染成绩。
#      **生产配置本身不动**。
#   2. 审计与检查点单独落盘：评测流量不混进生产审计。
#   3. planner.enabled 打开：消融 F 组要测多步规划。A–E 组由 ablation.py
#      逐组覆盖此项，不受这里影响。
#
# 用法：
#   python -m evals.replay   -c config/ragforge-eval.yaml --golden evals/golden-ragforge.jsonl --blind
#   python -m evals.ablation -c config/ragforge-eval.yaml --golden evals/golden-ragforge.jsonl
#
datasource:
  type: postgresql
  dsn: "host=127.0.0.1 port=15432 dbname=ragforge user=askdb_ro"
  password_env: ASKDB_PROD_PG_PASSWORD
  # dsn 指向的是隧道本地端口；真实库在这里。界面与评测出处按此显示，
  # 否则出处栏会写成 127.0.0.1，等于把最关键的一条信息说错。
  upstream: "8.163.30.216:5432"           # 同生产库，评测专用配置

tenant:
  enabled: true
  column: org_id
  default_ctx: 316                   # 职场数据分享组织
  mode: rls_and_predicate            # 应用层 AST 改写 + 数据库 RLS，双层
  on_unresolved: reject

guard:
  # 主库场景：宁可查不出来，也不能把库拖慢
  max_rows: 500
  max_scan_rows: 200000              # documents 全表 86,546 行，够用；再大的一律打回
  statement_timeout_ms: 5000         # 与角色级 statement_timeout 一致
  max_retry: 2
  allow_select_star: false
  allowed_schemas: [public, main]   # R-06：其余 schema 与跨库引用一律拒绝
  deny_functions:
    - pg_read_file
    - pg_ls_dir
    - pg_read_binary_file
    - lo_import
    - lo_export
    - dblink
    - pg_sleep
    # MySQL 侧的同类。理由与上面那几个完全一样：白名单式配置换库即用，
    # 不靠"换库时记得补齐"。三个都不是理论风险 ——
    #   sleep / benchmark  占住连接与 CPU（sleep 还有一个坑：MySQL 的
    #                      max_execution_time 会中断它，但语句照样返回成功，
    #                      于是 R-12 那一层在它身上看不出任何异常）
    #   load_file          读服务器本地文件，与 pg_read_file 同一件事
    - sleep
    - benchmark
    - load_file
    - get_lock
    - master_pos_wait
    - query_to_xml
    - pg_stat_file

planner:
  # 多步是兜底路径不是默认路径：能用一条 SQL（含 CTE）表达的一律单步。
  # 默认关闭 —— 首轮消融的结论：F 组成本 +109%，多跳准确率未提升。
  # 按 §6.3 定下的规则「成本上升而多跳无收益则回退为默认关闭的开关」执行。
  # 需要多跳能力时显式打开。
  enabled: true
  max_steps: 3                       # R-16 总步数上限
  max_carry_rows: 50                 # R-15 中间结果规模上限，超限即收敛
  carry_columns_only: true           # 仅下传标识列，不下传整行（§5.3.2 / §10.1）
  cost_cap_tokens: 12000             # R-17 单次问答累计 token 上限，0 表示不限
  on_cap_reached: converge           # converge | fail —— 触顶后收敛作答并标注，不静默返回

schema_rag:
  mode: keyword
  top_k: 3
  max_k: 5
  token_budget: 1500
  # 以下仅 mode: vector 生效
  embedding_model: text-embedding-v4
  min_score: 0.35        # 相似度门槛。注意它**不是硬阈值**：设计 §3.2.3 要求
                         # 「召回 Top-K（默认 3）表」，所以过线的表不足 top_k 张时，
                         # 会按相似度补齐到 top_k —— 宁可多给一张，也不让模型无表可用。
                         # 想让它成为硬阈值，得先改设计文档里的 Top-K 约定。
  max_metrics: 2         # 口径是强约束（"必须用此定义"），塞多了会误导模型

llm:
  provider: dashscope
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: qwen3.8-flash
  temperature: 0
  api_key_env: DASHSCOPE_API_KEY
  price_input_per_1k: 0.0008        # 0.8 元/百万 Token（2026-09-06 核对官方单价）
  price_output_per_1k: 0.0027       # 2.7 元/百万 Token
  # 百炼的上下文缓存要显式创建，命中按标准输入价的 10% 计。实测本链路
  # cache_read 恒为 0（没建显式缓存），所以这个价目前用不上，写在这里是为了
  # 一旦启用显式缓存，账立刻就是对的，不必回头再改代码。
  price_cached_input_per_1k: 0.00008
  # 百炼无峰谷计费 —— 不配 peak_windows，倍率恒为 1.0。
  thinking: false                   # 该模型默认开思考，必须显式关（见 llm.py _build）
  fallback:
    provider: deepseek
    base_url: "https://api.deepseek.com"
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    # DeepSeek 直连单价（官网 2026-09-06 核对）。备选的单价必须写全：
    # 兜底触发时按**这里**结算，不再沿用主模型的价。
    # 按高峰填，空闲由 offpeak_multiplier 向下打折 —— 漏配时偏贵不偏便宜。
    price_input_per_1k: 0.003          # 未命中：高峰 3 元/1M（空闲 1.5）
    price_output_per_1k: 0.009         # 高峰 9 元/1M（空闲 4.5）
    price_cached_input_per_1k: 0.0001  # 命中：高峰 0.10 元/1M（空闲 0.05）
    offpeak_multiplier: 0.5
    peak_windows: ["09:00-12:00", "14:00-18:00"]   # 北京时间
    peak_weekdays_only: true
    peak_utc_offset_hours: 8

observability:
  audit_log: ./data/audit-ragforge-eval.jsonl
  checkpoint_db: ./data/checkpoints-ragforge-eval.sqlite
  daily_quota: 3000                  # 仅评测；生产配置仍为 100

tables_file: ./config/ragforge-prod-tables.yaml
metrics_file: ./config/ragforge-prod-metrics.yaml
