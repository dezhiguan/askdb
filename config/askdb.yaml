# askdb 主配置 —— 对应技术设计说明书 V1.1 附录 A
# 拟制日期 2026-08-11

datasource:
  type: duckdb                       # duckdb | postgresql
  path: ./data/sample.duckdb
  read_only: true                    # DuckDB 以只读模式打开，写操作在引擎层即被拒绝

tenant:
  column: org_id
  default_ctx: 65                    # P0 由 CLI --org 覆盖；后续由调用方上下文传入
  mode: predicate                    # predicate | rls | rls_and_predicate（rls 需 PostgreSQL）
  on_unresolved: reject              # 无法确定租户归属时拒绝，不放行

guard:
  max_rows: 1000                     # R-13
  max_scan_rows: 500000              # R-11（P1 接入 EXPLAIN 后生效）
  statement_timeout_ms: 8000         # R-12（PostgreSQL 生效；DuckDB 见 executor 说明）
  max_retry: 2                       # R-14，按步重置
  allow_select_star: false           # R-05
  allowed_schemas: [public, main]    # R-06：其余 schema 与跨库引用一律拒绝
  deny_functions:                    # R-07
    - read_csv
    - read_parquet
    - read_json
    - glob
    - pg_read_file
    - lo_import
    - dblink

planner:                             # P5 才启用，P0 恒为单步
  enabled: false
  max_steps: 3                       # R-16
  max_carry_rows: 50                 # R-15
  cost_cap_tokens: 12000             # R-17

schema_rag:
  mode: keyword                    # keyword（P0）| all | vector（P1）
  top_k: 3
  max_k: 5
  token_budget: 1500

llm:
  provider: dashscope
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: qwen-max
  temperature: 0
  api_key_env: DASHSCOPE_API_KEY     # 仅走环境变量，禁止写入配置文件
  price_input_per_1k: 0.0024         # ⚠️ 未经核对的估值，待以官方单价校正
  price_output_per_1k: 0.0096        # ⚠️ 同上

  # 备选模型：仅在主模型「调用失败」时兜底一次（限流 / 超时 / 厂商故障）。
  # 生成的 SQL 不对不会切备选 —— 那是反思重试的职责，两者不要混。
  # 未列出的字段沿用上面的主配置。
  fallback:
    provider: deepseek
    base_url: "https://api.deepseek.com"
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY

  # ---- 备选：DeepSeek V4（官方单价，2026-08 核对）----
  # provider: deepseek
  # base_url: "https://api.deepseek.com"
  # model: deepseek-v4-flash         # 或 deepseek-v4-pro
  # api_key_env: DEEPSEEK_API_KEY
  # price_input_per_1k: 0.001        # 缓存未命中 1 元/1M；命中 0.02 元/1M（自动前缀缓存）
  # price_output_per_1k: 0.002       # 2 元/1M（pro 为 3 元 / 6 元）
  # thinking: false                  # 默认即 false。思考模式不支持强制 tool_choice，
  #                                  # 开启会导致结构化输出直接 400；SQL 生成也用不上长链思考。

observability:
  audit_log: ./data/audit.jsonl
  checkpoint_db: ./data/checkpoints.sqlite   # 失败样本原样复现，供 P3 评测归因
  daily_quota: 500                           # 每日调用上限，防循环调用导致成本失控

tables_file: ./config/tables.yaml
metrics_file: ./config/metrics.yaml
